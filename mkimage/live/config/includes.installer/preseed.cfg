# debian-installer 的预置答案。
#
# 每一条后面的注释指安装手册附录 B 的小节编号（B.4.x），照那一节的
# 示例改出来，不凭记忆写。
#
# 这份还没在真实构建上跑过。要验的两处列在 mkimage/BUILD.md 第六节：
# 根分区卷标的写法和 late_command 换菜单。

# 本地化问题排在安装最前面，只有打开自动模式才能用文件预置它们（B.4.1）
d-i auto-install/enable boolean true

### B.4.1 本地化
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

### B.4.3 网络
# 安装过程不需要网络：要装的东西全在镜像里
d-i netcfg/enable boolean false

### B.4.6 账号
# 不设 root 口令，管理员走 sudo；leaf 固定 1000，与镜像里的属主一致
d-i passwd/root-login boolean false
d-i passwd/username string leaf
d-i passwd/user-fullname string leaf
d-i passwd/user-password password leaf
d-i passwd/user-password-again password leaf
d-i passwd/user-uid string 1000
d-i passwd/user-default-groups string sudo tty video render netdev plugdev

### B.4.7 时钟
d-i clock-setup/utc boolean true
d-i time/zone string Asia/Shanghai
d-i clock-setup/ntp boolean true

### B.4.8 分区
# 目标是块空盘：GPT，一个 EFI 分区加一个 ext4 根。
# 不写 partman-auto/disk —— 只有一块盘时 d-i 自己会用那块，
# 多盘时由使用者选，写死盘符等于把这套东西绑到一台机器上。
d-i partman-auto/method string regular
d-i partman-auto/expert_recipe string                                     \
	camphor ::                                                        \
		538 538 1075 free                                         \
			$iflabel{ gpt }                                   \
			$reusemethod{ }                                   \
			method{ efi }                                     \
			format{ }                                         \
		.                                                         \
		4096 8192 1000000000 ext4                                 \
			method{ format }                                  \
			format{ }                                         \
			use_filesystem{ }                                 \
			filesystem{ ext4 }                                \
			label{ camphor }                                  \
			mountpoint{ / }                                   \
		.

d-i partman-partitioning/default_label string gpt
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# 根按卷标挂，和 boot/grub.cfg 里 search --label camphor 保持一致（B.4.8.3）
d-i partman/mount_style select label

### B.4.10 apt
d-i apt-setup/use_mirror boolean false
d-i apt-setup/services-select multiselect

### B.4.11 包选择
# 系统内容已经在 live 镜像里，不跑 tasksel
d-i pkgsel/run_tasksel boolean false

### B.4.12 引导
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean false
d-i grub-installer/bootdev string default

### B.4.13 收尾
d-i finish-install/reboot_in_progress note

### 菜单
# grub-installer 会用 grub-mkconfig 重写菜单，写出来是按 UUID 找根的。
# 换回仓库里那份按卷标找根的：构建时它被留在 /usr/share/camphor/grub.cfg，
# 因为 /boot/grub/grub.cfg 会被 grub-installer 覆盖。
d-i preseed/late_command string in-target cp /usr/share/camphor/grub.cfg /boot/grub/grub.cfg
