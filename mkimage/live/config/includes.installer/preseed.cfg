# debian-installer 的预置答案。
#
# 每一条后面的注释指安装手册附录 B 的小节编号（B.4.x），照那一节的
# 示例改出来，不凭记忆写。
#
# 目标是全程无人应答：任何一问没答掉，安装就停在那里等人点。
# 已经在 QEMU 的 OVMF Secure Boot 下跑过整轮，装完能从盘起来。

# 本地化问题排在安装最前面，只有打开自动模式才能用文件预置它们（B.4.1）
d-i auto-install/enable boolean true

### B.4.1 本地化
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

### B.4.3 网络
# 安装过程不需要网络：要装的东西全在镜像里
d-i netcfg/enable boolean false
# d-i 自己的运行环境只带最基本的固件，遇到无线网卡与音频会弹
# 「Load missing firmware from removable media?」把无人值守卡住。
# 装好的系统自带全部固件（在 squashfs 里），安装时用不上，直接答掉。
d-i hw-detect/load_firmware boolean false
# 关掉网络之后主机名与域名仍然会问（问题属于 netcfg），必须答掉，
# 否则安装会停在「Please enter the hostname for this system」
d-i netcfg/get_hostname string camphor
d-i netcfg/get_domain string localdomain

### B.4.6 账号
# 不设 root 口令，管理员走 sudo；leaf 固定 1000，与镜像里的属主一致
d-i passwd/root-login boolean false
d-i passwd/username string leaf
d-i passwd/user-fullname string leaf
d-i passwd/user-password password leaf
d-i passwd/user-password-again password leaf
d-i passwd/user-uid string 1000
d-i passwd/user-default-groups string sudo tty video render netdev plugdev

### B.4.7 时钟
d-i clock-setup/utc boolean true
d-i time/zone string Asia/Shanghai
d-i clock-setup/ntp boolean true

### B.4.8 分区
# 目标是块空盘：GPT，一个 EFI 分区加一个 ext4 根。
# 不写 partman-auto/disk —— 只有一块盘时 d-i 自己会用那块，
# 多盘时由使用者选，写死盘符等于把这套东西绑到一台机器上。
d-i partman-auto/method string regular
d-i partman-auto/expert_recipe string                                     \
	camphor ::                                                        \
		538 538 1075 free                                         \
			$iflabel{ gpt }                                   \
			$reusemethod{ }                                   \
			method{ efi }                                     \
			format{ }                                         \
		.                                                         \
		4096 8192 1000000000 ext4                                 \
			method{ format }                                  \
			format{ }                                         \
			use_filesystem{ }                                 \
			filesystem{ ext4 }                                \
			label{ camphor }                                  \
			mountpoint{ / }                                   \
		.

d-i partman-partitioning/default_label string gpt
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# 根按卷标挂，和 boot/grub.cfg 里 search --label camphor 保持一致（B.4.8.3）
d-i partman/mount_style select label

# 方案里没有 swap 分区（内存回收交给 zram），分完区 d-i 会弹一个确认框问要不要
# 回分区菜单，默认值是 true（回去）。预置成 false 才是「继续，不要 swap」。
d-i partman-basicfilesystems/no_swap boolean false

### B.4.10 apt
d-i apt-setup/use_mirror boolean false
d-i apt-setup/services-select multiselect

### B.4.11 包选择
# 系统内容已经在 live 镜像里，不跑 tasksel
d-i pkgsel/run_tasksel boolean false

### B.4.12 引导
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean false
d-i grub-installer/bootdev string default

### B.4.13 收尾
d-i finish-install/reboot_in_progress note

### 菜单与软件源
# 两处都要在安装末尾覆盖回去：
#   grub.cfg     grub-installer 会用 grub-mkconfig 重写菜单，写出来是按 UUID
#                找根的；按卷标找根的版本只在 ISO 的 camphor/ 目录里
#   sources.list apt-setup 会用生成结果覆盖，而我们不联网也不选镜像，
#                生成结果里只有安装介质的 cdrom 源，装完那张盘就不在了
# 安装介质在 d-i 环境里挂在 /cdrom
d-i preseed/late_command string cp /cdrom/camphor/grub.cfg /target/boot/grub/grub.cfg ; cp /cdrom/camphor/sources.list /target/etc/apt/sources.list
