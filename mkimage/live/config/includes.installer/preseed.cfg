# debian-installer 的预置答案 —— 入口。
#
# 分三份：本文件只开「预置当默认值」的开关并 include 下一份；
# preseed-hostname.cfg 放要让人看见的那条（主机名）；
# preseed-answers.cfg 放其余静默答案。
# 这样拆是因为 preseed.sh 在加载每个文件之前读 preseed/interactive，
# 写在同一个文件里不会对自己生效（B.5.4）。
d-i preseed/interactive boolean true
d-i preseed/include string /preseed-hostname.cfg
