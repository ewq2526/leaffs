# 静默预置的那部分答案 —— 由 preseed.cfg 经 preseed-hostname.cfg 链式加载，
# 加载时 preseed/interactive 已经关掉，所以这里的问题都不会出屏。
#
# 只写与具体机器无关、安装者不该被问的答案：不联网、不跑 tasksel、
# 不设 root 口令。分区、账号、时区、语言、键盘、引导装在哪里，
# 全部交回安装器由安装者当场选 —— 预置替人做的决定越少，能装的机器越多。
#
# 每一条后面的注释指安装手册附录 B 的小节编号（B.4.x），照那一节写。

### B.4.3 网络
# 安装过程不需要网络：要装的东西全在镜像里
d-i netcfg/enable boolean false
# d-i 自己的运行环境只带最基本的固件，遇到无线网卡与音频会弹
# 「Load missing firmware from removable media?」把安装卡住。
# 装好的系统自带全部固件（在 squashfs 里），安装时用不上，直接答掉。
d-i hw-detect/load_firmware boolean false

### B.4.6 账号
# 只定策略：不留 root 口令，管理员走 sudo。用户名与口令由安装者填 ——
# 镜像里预置一个账号，等于把一份已知口令随介质发出去。
d-i passwd/root-login boolean false
d-i passwd/user-default-groups string sudo tty video render netdev plugdev

### B.4.7 时钟
d-i clock-setup/utc boolean true
d-i clock-setup/ntp boolean true

### B.4.10 apt
d-i apt-setup/use_mirror boolean false
d-i apt-setup/services-select multiselect

### B.4.11 包选择
# 系统内容已经在 live 镜像里，不跑 tasksel
d-i pkgsel/run_tasksel boolean false

### B.4.13 收尾
d-i finish-install/reboot_in_progress note

### 装完按安装结果落定几处（B.4.13 的 late_command）
# 这些东西镜像本身给不出，只能等安装者选完再写：
#   sources.list  apt-setup 在不联网、不选镜像时只写 cdrom 源，装完那张盘
#                 就不在了，换回仓库里的镜像站版本
#   /etc/default/grub
#                 内核命令行参数得跟着系统走。只改这几项、其余行原样保留：
#                 这份文件是 grub-common 的 conffile，镜像里预先改它，装 grub
#                 时 dpkg 会停下来问「用包里的版本还是本地版本」；而整份覆盖
#                 又会把 grub-installer 写进去的其它设置（比如其它系统的探测）
#                 一起抹掉。所以镜像里不带它，装完按需合并，再重跑 update-grub。
#   /etc/fstab    不用动：partman 写的那份已经是 UUID，还带着 ESP 与 swap，
#                 比自己拼的完整
#   用户名        ksmbd 的共享与 camphor-filemgr 单元按名字认人，改成安装者
#                 建的账号（第一个普通用户）
# 安装介质在 d-i 环境里挂在 /cdrom，目标系统挂在 /target。
# 目标系统里没有普通用户时直接失败退出：与其装完服务起不来，不如当场看见这句。
d-i preseed/late_command string \
	cp /cdrom/camphor/sources.list /target/etc/apt/sources.list ; \
	f=/target/etc/default/grub ; \
	for kv in 'GRUB_DISTRIBUTOR="Camphor"' 'GRUB_TIMEOUT=8' 'GRUB_CMDLINE_LINUX_DEFAULT="quiet loglevel=4"' 'GRUB_CMDLINE_LINUX="net.ifnames=0 console=tty0 panic=10 rootwait"' 'GRUB_DISABLE_OS_PROBER=false' ; do \
		k=${kv%%=*} ; \
		if grep -q "^$k=" "$f" ; then sed -i "s|^$k=.*|$kv|" "$f" ; else printf '%s\n' "$kv" >> "$f" ; fi ; \
	done ; \
	in-target update-grub ; \
	u=$(awk -F: '$3>=1000 && $3<65534{print $1; exit}' /target/etc/passwd) ; \
	[ -n "$u" ] || { echo "camphor: 目标系统里没有普通用户" >&2 ; exit 1 ; } ; \
	sed -i "s/^\([[:space:]]*force user = \).*/\1$u/" /target/etc/ksmbd/ksmbd.conf ; \
	sed -i "s/^\([[:space:]]*valid users = \).*/\1$u/" /target/etc/ksmbd/ksmbd.conf ; \
	sed -i "s/^\([[:space:]]*\)User=.*/\1User=$u/;s/^\([[:space:]]*\)Group=.*/\1Group=$u/" /target/etc/systemd/system/camphor-filemgr.service
