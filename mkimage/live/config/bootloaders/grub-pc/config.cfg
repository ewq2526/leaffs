set default=0
# 菜单停住等选择：默认 5 秒就自动进 Live，装机的人根本来不及选安装项。
set timeout=30

if [ x$feature_default_font_path = xy ] ; then
    font=unicode
else
    font=$prefix/unicode.pf2
fi

if loadfont $font ; then
    # 跟着屏幕走：先试 1080p，取不到就让固件给最合适的那个。
    # 原来写死 800x600，底图也是 800x600，放到高分辨率屏上是放大后的糊图。
    set gfxmode=1920x1080,1600x900,1366x768,1280x800,1024x768,auto
    set gfxpayload=keep
    insmod efi_gop
    insmod efi_uga
    insmod video_bochs
    insmod video_cirrus
else
    set gfxmode=auto
    insmod all_video
fi

insmod gfxterm
insmod jpeg

source /boot/grub/theme.cfg

terminal_output gfxterm
