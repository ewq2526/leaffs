<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- LCD 上关掉次像素时中文会明显发虚：把 rgb 次像素、轻微 hinting、lcddefault 滤镜显式打开。
       Debian 默认装的是 10-sub-pixel-none.conf，改这一处比改 /etc/fonts/conf.d 里的符号链接稳。 -->
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="rgba" mode="assign"><const>rgb</const></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
  </match>

  <!-- 中文优先用 Noto Sans CJK SC；DejaVu 没有汉字，排在前面只会让浏览器再兜一次 -->
  <alias>
    <family>sans-serif</family>
    <prefer><family>Noto Sans CJK SC</family><family>DejaVu Sans</family></prefer>
  </alias>
  <alias>
    <family>system-ui</family>
    <prefer><family>Noto Sans CJK SC</family></prefer>
  </alias>
</fontconfig>
