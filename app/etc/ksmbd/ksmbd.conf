[global]
	server string = Camphor File Appliance
	netbios name = CAMPHOR
	workgroup = WORKGROUP
	server min protocol = SMB2_10
	server max protocol = SMB3_11
	logging file = /var/log/ksmbd/ksmbd.log

# 用户库：/etc/ksmbd/ksmbdpwd.db 是符号链接，指向 /run/ksmbd/ksmbdpwd.db ——
# 那是后端按应用账号表生成的内存盘文件（见 leaffs/system/smb.py），关机即消失，
# 开机由后端重建。盘上常驻的只有账号表里那份密文。
# 账号只有一份：应用自己的 users.json。不要再用 ksmbd.adduser 加账号 ——
# 下一次重建会覆盖。
#
# 落盘身份：应用账号**不是** Linux 用户，也不应该建 Linux 用户，所以 ksmbd 没有
# 对应的 uid 可映射，文件一律以安装时那个账号的身份落盘。
#
# 下面这处 `force user` 是占位：首次启动时由 camphor-firstboot.sh 换成安装时创建
# 的账号，并把共享目录的属主一并改成它。镜像里不写死某个账号。
#
# 账号共享不写在这个文件里：每个账号一个共享（名字就是账号名、`valid users` 只写它
# 自己、`browseable = no` 不进列表），由后端按账号表追加到本文件末尾的标记段里，并
# SIGHUP 让 mountd 重读。之前那个 "把所有人的目录装进一个共享" 的写法就是因为缺
# valid users，谁登录都能翻别人的目录，已经删掉。
#
# 这里没有 guest，也**没有任何公共共享**：任何共享都要先过认证，而认证之后能进的
# 只有自己那一个（valid users 写的就是自己），别人即便知道共享名也进不去。
# 共享名也不进浏览列表 —— 没登录的人连账号名都看不到。
#
# 共享不写在这个文件里：它们由后端按账号表追加到末尾的标记段（见
# leaffs/system/smb.py）。这里只留全局设置，一个 [public] 都不留 —— 一旦有公共
# 共享，等于所有人都能读写一块不属于自己的目录。
