# Camphor 的 wpa_supplicant 配置（wlan0 一个接口一份）
#
# camphor-wifi.service 用 -c 指定这个文件拉起 wpa_supplicant。镜像里原来没有
# 这个文件，服务一起来就报「读不到配置」退出，控制套接字不存在，
# 管理页那边连不上 wpa_cli，就只能显示 unavailable。
#
# 网络本身不写在这里：管理页扫描、连接时通过 wpa_cli 写，靠 update_config=1
# 落回这个文件。所以这里只需要把控制接口和保存打开。

ctrl_interface=/run/wpa_supplicant
ctrl_interface_group=0
update_config=1
ap_scan=1
