<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Logs</title>
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png?v=3">
<link rel="icon" type="image/png" sizes="192x192" href="/static/favicon.png?v=3">
<link rel="apple-touch-icon" href="/static/favicon.png?v=3">
<link rel="stylesheet" href="/static/style.css">
<script>window.__WS_PORT__=parseInt('__WS_PORT_NUM__',10)||8081;</script>
<script>window.__LANG__='en';</script></head>
<body>
<div class="app">
    <header class="top">
        <span class="top-logo"><img src="/static/logo.png" alt=""></span>
        <div class="top-main">
            <h1 class="top-title">Logs</h1>
        </div>
        <div class="top-side"><button class="nav-back" onclick="window.location.href='/admin'">Back to Admin</button>
            <!--THEME_TOGGLE--></div>
    </header>

    <nav class="tabs">
        <a href="/browse/">Browse</a>
        <a href="/gallery">Gallery</a>
        <a href="/url-download">Downloader</a>
        <a href="/share">Share</a>
        <a href="/admin">Admin</a>
        <a href="/me">My Account</a>
        <a href="/system">System</a>
        <a href="/log" class="active">Logs</a>
    </nav>
    <div class="tools">
        <span class="count" id="logCount">0 entries</span>
        <button class="btn btn-sm btn-outline" onclick="loadLogs()">Refresh</button>
        <button class="btn btn-sm btn-danger" onclick="clearLogs()">Clear</button>
    </div>
    <div class="panel overflow-hidden" style="padding:0">
        <div class="log-list" id="logList"><div class="log-empty">No logs yet</div></div>
    </div>
</div>
<script src="/static/app.js"></script>
<script>
function loadLogs() {
    fetch('/api/logs').then(function(r) { return r.json(); }).then(function(d) {
        var logs = d.logs || [];
        document.getElementById('logCount').textContent = logs.length + ' entries';
        var c = document.getElementById('logList');
        if (!logs.length) { c.innerHTML = '<div class="log-empty">No logs yet</div>'; return; }
        var h = '';
        for (var i = logs.length - 1; i >= 0; i--) {
            var l = logs[i];
            h += '<div class="log-item"><span class="log-time">' + esc(l.time) + '</span><span class="log-level ' + (l.level || 'info') + '">' + (l.level || 'info') + '</span><span class="log-msg">' + esc(l.msg) + '</span></div>';
        }
        c.innerHTML = h;
    });
}
function clearLogs() {
    if (!confirm('Clear all logs?')) return;
    fetch('/api/logs/clear', { method: 'POST' }).then(function(r) { return r.json(); }).then(function(d) {
        if (d && d.success) {
            document.getElementById('logList').innerHTML = '<div class="log-empty">Logs cleared</div>';
            document.getElementById('logCount').textContent = '0 entries';
        } else {
            batchToast('Clear failed', 'error');
        }
    }).catch(function() { batchToast('Clear failed', 'error'); });
}
loadLogs();
</script>
<script src="/static/arrow.js"></script>
</body>
</html>
