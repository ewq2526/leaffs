<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>系统</title>
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png?v=3">
<link rel="icon" type="image/png" sizes="192x192" href="/static/favicon.png?v=3">
<link rel="apple-touch-icon" href="/static/favicon.png?v=3">
<script>window.__WS_PORT__=parseInt('__WS_PORT_NUM__',10)||8081;</script>
<style>
/* ------------------------------------------------------------------
   这一页是任务管理器，不是站里的一个普通页面：没有站点头部、没有标签栏、
   不居中收窄。整块就是一个窗口的内容 —— 左边一列叠起来的资源，右边是
   选中那一项的曲线与数值表。
   版式与密度照任务管理器：1px 分隔线、28px 行高、12.5px 字号、数字等宽。
   下面的长度写成 rem：1rem = 设计稿上的 1px（根字号按屏幕短边算，见 html 规则），
   所以 28rem / 12.5rem 分别是 28 / 12.5 个设计像素，整页随屏幕等比缩放。
   ------------------------------------------------------------------ */
:root {
    --tm-bg: #1b1b1b;
    --tm-panel: #202020;
    --tm-side: #232323;
    --tm-line: #3a3a3a;
    --tm-line-soft: #2f2f2f;
    --tm-text: #f2f2f2;
    --tm-dim: #b9b9b9;
    --tm-mute: #8a8a8a;
}
* { box-sizing: border-box; }
/* 1rem = 设计稿上的 1px：根字号 = 短边 / 920（参考尺寸 1894×920 时正好 1px）。
   下面的长度直接写成 Nrem 就是原来的 N 个设计像素，整页随屏幕纯等比缩放 ——
   不设上下限：封了顶就不是"等比"了，屏幕再大再小都该按同一个比例走。 */
html { font-size: calc(100vmin / 920); }
html, body { height: 100%; }
body {
    margin: 0;
    background: var(--tm-bg);
    color: var(--tm-text);
    font-family: "Segoe UI", "Noto Sans CJK SC", "Microsoft YaHei", system-ui, sans-serif;
    font-size: 12.5rem;
    overflow: hidden;
    /* 桌面上的窗口内容：不要文字选中，不要橡皮筋滚动 */
    user-select: none;
    -webkit-user-select: none;
}
.tm-shell {
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 8rem 10rem 10rem;
    gap: 8rem;
}
/* 顶部一条本机信息：任务管理器里这一行是标签栏，这里放机器身份 */
.tm-bar {
    flex: 0 0 auto;
    display: flex; flex-wrap: wrap; align-items: center; gap: 6rem 12rem;
    padding: 4rem 4rem 2rem;
    font-size: 12rem;
    color: var(--tm-mute);
}
.tm-bar b { color: var(--tm-text); font-weight: 600; font-variant-numeric: tabular-nums; }
.tm-bar .sep { color: #4a4a4a; }
.tm-bar select {
    background: var(--tm-panel); color: var(--tm-text);
    border: 1rem solid var(--tm-line); border-radius: 3rem;
    font: inherit; padding: 2rem 4rem; max-width: 200rem;
    /* 下拉列表是浏览器画的，不声明 color-scheme 时它按浅色画，字是浅色 → 白底白字 */
    color-scheme: dark;
}
.tm-bar select option { background: var(--tm-panel); color: var(--tm-text); }
/* 退出：这一页在 kiosk 里是整屏窗口，没有浏览器地址栏与后退键，
   不给一个出口就只能在 tty2 上敲命令。 */
.tm-exit {
    margin-left: auto;
    color: var(--tm-dim); text-decoration: none;
    border: 1rem solid var(--tm-line); border-radius: 3rem;
    padding: 1rem 10rem; font-size: 12rem;
    white-space: nowrap;
}
.tm-exit:hover { color: var(--tm-text); border-color: #5a5a5a; background: #2a2a2a; }

/* 主体：左列 + 右详情，中间 1rem 线 */
.tm {
    flex: 1 1 auto;
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(200rem, 24%) 1fr;
    border: 1rem solid var(--tm-line);
    background: var(--tm-panel);
    overflow: hidden;
}
.tm-stack {
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    border-right: 1rem solid var(--tm-line);
    background: var(--tm-side);
}
.tm-item {
    position: relative;
    width: 100%;
    height: 64rem;
    padding: 6rem 10rem 7rem 12rem;
    border: 0;
    border-bottom: 1rem solid var(--tm-line-soft);
    background: none;
    color: inherit;
    font: inherit;
    text-align: left;
    cursor: pointer;
    display: grid;
    grid-template-columns: 1fr auto;
    grid-template-rows: auto 1fr;
    column-gap: 8rem;
}
.tm-item:hover { background: #2a2a2a; }
.tm-item.on { background: #2e2e2e; }
.tm-item.on::before {
    content: "";
    position: absolute; left: 0; top: 0; bottom: 0; width: 3rem;
    background: var(--primary, #34d399);
}
.tm-item .nm {
    grid-column: 1;
    font-size: 12rem; color: var(--tm-dim);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.tm-item .pv {
    grid-column: 2;
    font-size: 15rem; font-weight: 600; color: var(--tm-text);
    font-variant-numeric: tabular-nums;
    min-width: 4.5ch; text-align: right; white-space: nowrap;
}
.tm-item .pv.small { font-size: 12rem; font-weight: 500; }
.tm-item .spark { grid-column: 1 / -1; width: 100%; height: 20rem; display: block; margin-top: 2rem; }
/* 磁盘条目多一行：类型 + 型号。型号只在盘自己报得出来、且不是设备名的时候才写，
   否则等于把 "sda" 又抄一遍。 */
.tm-item.disk { height: 78rem; grid-template-rows: auto auto 1fr; }
.tm-item .sub {
    grid-column: 1 / -1; grid-row: 2;
    font-size: 10.5rem; color: var(--tm-mute);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    margin-top: 1rem;
}
/* 没有曲线的条目（无线 / 电池 / 服务）：一行字在整条里居中，否则字全挤在顶上，
   下面空出半条，看着像少画了什么。 */
.tm-item.plain { grid-template-rows: auto; align-content: center; }
.tm-item .spark path.line, .tm-chart path.line {
    fill: none; stroke: var(--primary, #34d399); stroke-width: 1.2; vector-effect: non-scaling-stroke;
}
.tm-item .spark path.area, .tm-chart path.area { fill: var(--primary, #34d399); opacity: 0.14; stroke: none; }
.tm-item .spark path.line.warn, .tm-chart path.line.warn { stroke: var(--warn, #f5b74e); }
.tm-item .spark path.area.warn, .tm-chart path.area.warn { fill: var(--warn, #f5b74e); }
.tm-item .spark path.line.danger, .tm-chart path.line.danger { stroke: var(--danger, #ef6461); }
.tm-item .spark path.area.danger, .tm-chart path.area.danger { fill: var(--danger, #ef6461); }
/* 磁盘图有两条线：读=主题色，写=橙色 */
.tm-chart path.line.w2 { stroke: var(--warn, #f5b74e); }
.tm-chart path.area.w2 { fill: var(--warn, #f5b74e); }
.tm-chart path.grid { fill: none; stroke: var(--tm-line); stroke-width: 1; stroke-dasharray: 2 3; vector-effect: non-scaling-stroke; }

/* 右详情。内边距放在详情自己身上，容器留空：详情要按容器高度定 min-height，
   容器带内边距的话 100% 会比可见区多出内边距那一截，白白多出一条滚动条。 */
.tm-panes { min-height: 0; overflow-y: auto; }
.tm-detail { display: none; }
.tm-detail.on {
    display: flex;
    flex-direction: column;
    min-height: 100%;
    padding: 10rem 14rem 16rem;
}

.tm-hd {
    display: flex; align-items: baseline; gap: 10rem;
    padding-bottom: 6rem; margin-bottom: 8rem;
    border-bottom: 1rem solid var(--tm-line);
}
.tm-hd h2 { margin: 0; font-size: 14rem; font-weight: 600; }
.tm-hd .sub { margin-left: auto; font-size: 11.5rem; color: var(--tm-mute); }
/* 磁盘图的图例：读一条、写一条 */
.tm-hd .dlegend {
    display: flex; align-items: center; gap: 5rem;
    margin-left: 14rem; font-size: 11rem; color: var(--tm-mute);
}
.tm-hd .dlegend i { width: 11rem; height: 2rem; display: inline-block; }
.tm-hd .dlegend i.c-rd { background: var(--primary, #34d399); }
.tm-hd .dlegend i.c-wr { background: var(--warn, #f5b74e); }

/* 总利用率 / 逻辑处理器 的切换。两样同时画一屏放不下，只留一个，省下来的高度全给图。 */
.tm-seg {
    display: inline-flex; align-items: stretch; align-self: center;
    border: 1rem solid var(--tm-line-soft);
}
.tm-seg button {
    background: none; border: 0; margin: 0; cursor: pointer;
    font: inherit; font-size: 11.5rem; line-height: 1;
    color: var(--tm-dim); padding: 4rem 10rem;
}
.tm-seg button + button { border-left: 1rem solid var(--tm-line-soft); }
.tm-seg button.on { background: #2b2b2b; color: var(--text); }
/* 两个视图占同一块地方：显示的吃满，hidden 的不参与布局 */
.tm-view { flex: 1 1 0; min-height: 140rem; min-width: 0; display: flex; }
.tm-view[hidden] { display: none; }

/* 大曲线吃掉标题与数值表之外的全部高度。试过封顶 40vh：表下面会空出 230~310rem 的死区，
   比曲线偏大更难看，所以不封顶。flex-basis 必须是 0 —— SVG 带 viewBox，basis 为 auto 时
   会先按 100:40 算出固有高度，再被截一刀，白折腾。 */
.tm-chart { width: 100%; flex: 1 1 0; min-height: 140rem; display: block; }
/* 刻度文字。大图按像素画（1 单位 = 1rem），10rem 就是屏幕上的 10rem */
.tm-chart text {
    font-size: 10rem; fill: var(--tm-mute);
    font-variant-numeric: tabular-nums; user-select: none;
}

/* 曲线下面：左边数值表，右边附属（内存的组成 / 磁盘分区 / 网络列表）。
   左列定宽而不是 1fr：数值靠右对齐，列一宽，键和值就隔开半屏，读起来要来回找。 */
.tm-cols {
    display: grid;
    grid-template-columns: minmax(0, 420rem) minmax(0, 1fr);
    gap: 16rem 36rem;
    margin-top: 10rem;
    align-items: start;
}
.tm-cols.one { grid-template-columns: minmax(0, 1fr); }

.tm-table { min-width: 0; }
/* 两列摆放：五行压成三行，少掉的高度让给上面的图。
   分隔线画成 border-top（第一行不要），这样最后一行不会拖一条悬空的横线。 */
.tm-table.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: 36rem; }
.tm-table.two .tm-row { border-bottom: 0; border-top: 1rem solid var(--tm-line-soft); }
.tm-table.two > .tm-row:nth-child(-n+2) { border-top: 0; }
/* 温度那几行由脚本插进一个容器里，容器本身不占格子，孩子们直接进网格 */
.tm-table.two #tempRows { display: contents; }
.tm-row {
    display: grid;
    grid-template-columns: max-content minmax(0, 1fr);
    align-items: center;
    min-height: 26rem;
    border-bottom: 1rem solid var(--tm-line-soft);
    font-size: 12rem;
}
.tm-row:last-child { border-bottom: 0; }
.tm-row .k { color: var(--tm-dim); }
.tm-row .v {
    text-align: right;
    font-variant-numeric: tabular-nums;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

.tm-side h3 {
    margin: 0 0 6rem;
    font-size: 11.5rem; font-weight: 600; color: var(--tm-dim);
}
/* 逻辑处理器：一个核一个方框，框里是它自己的曲线，框左上角是名字、右上角是当前值。
   视图切到"逻辑处理器"时它铺满整块，所以按可用宽度自动分列；行高给上下限，
   免得核少的时候（4 核铺满一屏）拉成一根两尺高的柱子。 */
.tm-cores {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(240rem, 1fr));
    grid-auto-rows: minmax(96rem, 260rem);
    align-content: start;
    gap: 8rem; width: 100%; min-height: 0;
}
.tm-core {
    border: 1rem solid var(--tm-line-soft);
    background: #1c1c1c;
    padding: 5rem 8rem 4rem;
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    grid-template-rows: auto minmax(0, 1fr);
    column-gap: 6rem;
}
.tm-core .n { font-size: 10.5rem; color: var(--tm-mute); white-space: nowrap; }
/* 核名后面的当前频率 */
.tm-core .n .mhz {
    margin-left: 7rem; font-weight: 400;
    color: var(--tm-dim); font-variant-numeric: tabular-nums;
}
.tm-core .v {
    font-size: 11.5rem; color: var(--tm-dim); text-align: right;
    font-variant-numeric: tabular-nums;
}
.tm-core .mini {
    grid-column: 1 / -1;
    width: 100%; height: 100%; min-height: 0;
    display: block; margin-top: 3rem;
}
.tm-core .mini path.line { fill: none; stroke: var(--primary, #34d399); stroke-width: 1.1; }
.tm-core .mini path.area { fill: var(--primary, #34d399); opacity: 0.13; stroke: none; }
.tm-core .mini path.line.warn { stroke: var(--warn, #f5b74e); }
.tm-core .mini path.area.warn { fill: var(--warn, #f5b74e); }
.tm-core .mini path.line.danger { stroke: var(--danger, #ef6461); }
.tm-core .mini path.area.danger { fill: var(--danger, #ef6461); }

/* 内存的组成条 + 图例。宽度跟左边的数值表对齐：图例是「名字 …… 数值」两列，
   拉到整幅宽之后名字在左头、数值在右头，中间隔着一米，读不了。 */
.tm-stack-bar { display: flex; height: 10rem; overflow: hidden; background: #3a3a3a; margin-bottom: 8rem; max-width: 420rem; }
.tm-legend { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 2rem 8rem; font-size: 11.5rem; max-width: 420rem; }
.tm-legend .n { color: var(--tm-dim); display: flex; align-items: center; gap: 6rem; }
.tm-legend .n i { width: 9rem; height: 9rem; display: inline-block; }
.tm-legend .v { text-align: right; color: var(--tm-text); font-variant-numeric: tabular-nums; }

/* 分区行：名字、文件系统与挂载、占用条、用量。列宽都定死 —— 用 1fr 让元信息吃掉
   全部空档时，条子和用量会被顶到行的最右头，跟名字脱节。 */
.tm-part {
    display: grid;
    grid-template-columns: max-content max-content 96rem max-content;
    align-items: center; gap: 10rem;
    padding: 5rem 0;
    border-bottom: 1rem solid var(--tm-line-soft);
    font-size: 11.5rem;
    max-width: 720rem;
}
.tm-part:last-child { border-bottom: 0; }
.tm-part .pname { color: var(--tm-text); font-weight: 600; }
.tm-part .pmeta { color: var(--tm-mute); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tm-part .pbar { height: 4rem; background: #3a3a3a; overflow: hidden; }
.tm-part .pbar > i { display: block; height: 100%; background: var(--primary, #34d399); }
.tm-part .pbar > i.danger { background: var(--danger, #ef6461); }
.tm-part .puse { color: var(--tm-dim); font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }

/* 服务表：单元 | 状态 | 内存 | CPU 时间 | PID。列宽定死，行不能拉满整幅宽 ——
   名字在左头、状态在右头的时候，中间空出一米，读一行要横扫半个屏。 */
.tm-svc {
    display: grid;
    grid-template-columns: minmax(0, 1.5fr) 62rem 84rem 92rem 62rem;
    align-items: center; gap: 10rem;
    padding: 5rem 0; border-bottom: 1rem solid var(--tm-line-soft); font-size: 12rem;
    max-width: 720rem;
}
.tm-svc:last-child { border-bottom: 0; }
.tm-svc > span:not(.n):not(.tag) {
    text-align: right; font-variant-numeric: tabular-nums; color: var(--tm-dim);
}
.tm-svc .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tm-svc .tag { font-size: 11rem; color: var(--tm-mute); }
.tm-svc .tag.tag-local { color: var(--primary, #34d399); }
.tm-svc .tag.tag-gone { color: var(--danger, #ef6461); }
.tm-svc .tag.tag-coded { color: var(--warn, #f5b74e); }
/* 表头：与行同列，只用一条实线分开 */
.tm-svc-hd { color: var(--tm-mute); font-size: 11rem; border-bottom: 1rem solid var(--tm-line); }
.tm-svc-hd > span { text-align: left; }
.tm-svc-hd > span:not(:first-child) { text-align: right; }
.tm-svc-hd > span:nth-child(2) { text-align: left; }

/* 进程榜（内存详情右栏） */
.tm-procs { max-width: 520rem; }
.tm-proc {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 92rem 62rem;
    gap: 10rem; padding: 3rem 0;
    font-size: 11.5rem;
    border-bottom: 1rem solid var(--tm-line-soft);
}
.tm-proc:last-child { border-bottom: 0; }
.tm-proc .pn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tm-proc .pm, .tm-proc .pp {
    text-align: right; font-variant-numeric: tabular-nums; color: var(--tm-dim);
}
.tm-proc .pp { color: var(--tm-mute); }
.tm-proc-hd {
    color: var(--tm-mute); font-size: 11rem; max-width: 520rem;
    border-bottom: 1rem solid var(--tm-line); padding-bottom: 3rem;
}
.tm-proc-hd span:not(:first-child) { text-align: right; }
.tm-side h3.mt { margin-top: 14rem; }

/* 无线列表：站在深色底上，事件行样式跟着任务管理器的表走。
   封宽 640：名字在左头、强度在右头、中间空一米的话，一行读不完。 */
.srow {
    display: flex; align-items: center; gap: 8rem;
    padding: 5rem 0; border-bottom: 1rem solid var(--tm-line-soft);
    font-size: 12rem; color: var(--tm-text);
    max-width: 640rem;
}
.srow:last-child { border-bottom: 0; }
.srow .srow-name { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.srow .srow-path { color: var(--tm-mute); font-size: 11.5rem; white-space: nowrap; }
.srow.ph { color: var(--tm-mute); }
.wifi-input {
    flex: 1 1 auto; min-width: 0;
    background: #1b1b1b; color: var(--tm-text);
    border: 1rem solid var(--tm-line); border-radius: 3rem; padding: 3rem 6rem; font: inherit;
}
.wifi-input:focus { outline: none; border-color: var(--primary, #34d399); }
.btn {
    background: #2d2d2d; color: var(--tm-text);
    border: 1rem solid var(--tm-line); border-radius: 3rem;
    padding: 3rem 10rem; font: inherit; cursor: pointer;
}
.btn:hover { background: #383838; }
.btn-sm { font-size: 11.5rem; }
.btn-primary { background: #2f5d4a; border-color: #3f7a61; }
.c-danger-strong { color: var(--danger, #ef6461); }
.tm-item:focus-visible, .srow:focus-visible, .btn:focus-visible {
    outline: 2rem solid var(--primary, #34d399); outline-offset: -2rem;
}
</style>
</head>
<body>
<div class="tm-shell">

    <!-- 顶部：机器身份 + 时区 -->
    <div class="tm-bar">
        <b id="rowHost">-</b>
        <span class="sep">|</span><span id="rowKernel">-</span>
        <span class="sep">|</span><span id="rowArch">-</span>
        <span class="sep">|</span><span>运行 <b id="rowUptime">-</b></span>
        <span class="sep">|</span><span>负载 <b id="rowLoad">-</b></span>
        <span class="sep">|</span><span>启动于 <b id="rowBoot">-</b></span>
        <span class="sep">|</span>
        <select id="tzSelect" aria-label="时区"></select>
        <a class="tm-exit" href="/" title="返回文件浏览（Esc 也可以）">返回</a>
    </div>

    <div class="tm">
        <!-- 左：叠起来的资源条目；磁盘那组按盘数生成 -->
        <div class="tm-stack" id="tmStack">
            <button class="tm-item" type="button" data-tab="cpu" id="stkCPU">
                <span class="nm">CPU</span><span class="pv" id="stkCpuPv">-</span>
                <svg class="spark" id="stkCpuSpark" viewBox="0 0 100 22" preserveAspectRatio="none"></svg>
            </button>
            <button class="tm-item" type="button" data-tab="mem" id="stkMem">
                <span class="nm">内存</span><span class="pv" id="stkMemPv">-</span>
                <svg class="spark" id="stkMemSpark" viewBox="0 0 100 22" preserveAspectRatio="none"></svg>
            </button>
            <div id="stkDisks"></div>
            <button class="tm-item" type="button" data-tab="net" id="stkNet">
                <span class="nm">无线网络</span><span class="pv small" id="stkNetPv">-</span>

<script>
// 页面自己保存最近两分钟的采样（每秒一个点，共 120 点）：曲线只画趋势，
// 不把历史放到服务端 —— 服务端一旦存历史，重启就丢，页面还要处理缺口。
var HISTORY = 120;
var hist = { cpu: [], mem: [], cores: [] };
var lastIo = {};
var histIo = {};

function fmtBytes(n) {
    if (!n) return '0';
    var u = ['B', 'KB', 'MB', 'GB', 'TB'], i = 0;
    while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
    return (n >= 100 ? n.toFixed(0) : n.toFixed(1)) + ' ' + u[i];
}
function fmtUptime(s) {
    var d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
    if (d) return d + ' 天 ' + h + ' 小时';
    if (h) return h + ' 小时 ' + m + ' 分';
    return m + ' 分';
}
function fmtTime(ts) {
    var d = new Date(ts * 1000), p = function (x) { return (x < 10 ? '0' : '') + x; };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}
function level(v, warn, danger) { return v >= danger ? 'danger' : (v >= warn ? 'warn' : ''); }
function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
}

// 写前先比：值没变就不碰节点。整页所有写入都走这几个函数。
var _wrote = {};
function setText(id, s) {
    if (_wrote[id] === s) return;
    _wrote[id] = s;
    var el = document.getElementById(id);
    if (el) el.textContent = s;
}
function setNodeText(el, key, s) {
    if (!el) return;
    if (_wrote[key] === s) return;
    _wrote[key] = s;
    el.textContent = s;
}
function setNodeHtml(el, key, s) {
    if (!el) return;
    if (_wrote[key] === s) return;
    _wrote[key] = s;
    el.innerHTML = s;
}
function setChart(key, el, data, cls, fn) {
    if (!el) return;
    var sig = cls + '|' + data.join(',');
    if (_wrote[key] === sig) return;
    // 画不了（容器还没排版出来，隐藏的详情就是这种）就不要写签名 ——
    // 否则切过去时签名没变，图一直空着。画布函数返回 false 表示这次没画成。
    if (fn(el, data, cls) === false) return;
    _wrote[key] = sig;
}
// 两条线：读写各一条，签名要把两条都算进去
function setChart2(key, el, a, b, fn) {
    if (!el) return;
    var sig = a.join(',') + '|' + b.join(',');
    if (_wrote[key] === sig) return;
    if (fn(el, a, b) === false) return;
    _wrote[key] = sig;
}
function forget(prefix) {
    for (var k in _wrote) {
        if (k.indexOf(prefix) === 0) delete _wrote[k];
    }
}
function keyActivate(node, fn, label) {
    node.tabIndex = 0;
    node.setAttribute('role', 'button');
    if (label) node.setAttribute('aria-label', label);
    node.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fn(); }
    });
    return node;
}

// 左列 20px 的迷你曲线：不画刻度。0~100 抽象坐标 + preserveAspectRatio="none" 拉伸到整宽；
// 这里没有文字，横向拉伸不会变形。
function drawLine(el, data, cls, h) {
    var w = 100, pad = 3, n = HISTORY;
    h = h || 30;
    if (!data.length) { el.innerHTML = ''; return; }
    var full = data.length >= n;
    var step = w / (full ? (n - 1) : Math.max(data.length - 1, 1));
    var pts = [], x0 = null;
    for (var i = 0; i < data.length; i++) {
        var x = full ? (w - (data.length - 1 - i) * step) : (i * step);
        if (x0 === null) x0 = x;
        var v = Math.max(0, Math.min(100, data[i])) / 100;
        var y = (h - pad) - v * (h - 2 * pad);
        pts.push(x.toFixed(2) + ' ' + y.toFixed(2));
    }
    if (pts.length === 1) pts.push(pts[0]);
    var line = 'M' + pts.join(' L');
    var area = line + ' L' + (full ? w : x0.toFixed(2)) + ' ' + (h - pad) +
               ' L' + x0.toFixed(2) + ' ' + (h - pad) + ' Z';
    el.innerHTML = '<line class="grid" x1="0" y1="' + (h - pad) + '" x2="' + w + '" y2="' + (h - pad) + '"></line>' +
                   '<path class="area ' + cls + '" d="' + area + '"></path>' +
                   '<path class="line ' + cls + '" d="' + line + '"></path>';
}
function drawSpark(el, data, cls) { drawLine(el, data, cls, 22); }

// ---- 大图：按像素画，带刻度 ----
// viewBox 铺成容器的实际像素尺寸，1 单位 = 1px。之前是 viewBox 0~100 再横向拉伸，
// 那样刻度文字会被拉宽一倍（1400px 里 100 个单位，每单位 14px），所以字不能画在拉伸图里。
// 纵轴：百分比固定 0~100 四等分；速率按峰值取整成 0 / 半程 / 峰值。
// 横轴：120 个 1 秒位置，最新的样本永远贴右边，攒满之后整体左移。
var CH_PAD_R = 44, CH_PAD_T = 8, CH_PAD_B = 16, CH_PAD_L = 2;

function chSize(el) {
    var r = el.getBoundingClientRect();
    return { w: Math.round(r.width), h: Math.round(r.height) };
}

// 速率量程取整到 1 / 2 / 5 × 10^n，刻度才不会是「3.7 MB/s」这种读数
function niceCeil(v) {
    if (!(v > 0)) return 1;
    var e = Math.pow(10, Math.floor(Math.log(v) / Math.LN10));
    var m = v / e;
    return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * e;
}

function drawChartPx(el, series, pct) {
    var size = chSize(el);
    if (size.w < 80 || size.h < 50) return false;   // 还没排版出来，等下一拍
    var w = size.w, h = size.h, i, k;
    var pw = w - CH_PAD_L - CH_PAD_R;
    var ph = h - CH_PAD_T - CH_PAD_B;
    var span = 100;
    if (!pct) {
        var peak = 0;
        for (k = 0; k < series.length; k++) {
            var arr = series[k].d;
            for (i = 0; i < arr.length; i++) { if (arr[i] > peak) peak = arr[i]; }
        }
        span = niceCeil(peak);
    }
    var out = [];
    el.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
    var ticks = pct ? [0, 25, 50, 75, 100] : [0, span / 2, span];
    ticks.forEach(function (t) {
        var y = CH_PAD_T + ph - (t / span) * ph;
        out.push('<line class="grid" x1="' + CH_PAD_L + '" y1="' + y.toFixed(1) +
                 '" x2="' + (CH_PAD_L + pw) + '" y2="' + y.toFixed(1) + '"></line>');
        out.push('<text x="' + (w - 4) + '" y="' + (y + 3.5).toFixed(1) +
                 '" text-anchor="end">' + (pct ? t.toFixed(0) + '%' : fmtRate(t)) + '</text>');
    });
    for (k = 0; k < series.length; k++) {
        var data = series[k].d, cls = series[k].cls;
        if (!data.length) continue;
        var step = pw / (HISTORY - 1);
        var pts = [], x0 = null, xl = null;
        for (i = 0; i < data.length; i++) {
            var x = CH_PAD_L + pw - (data.length - 1 - i) * step;
            var v = pct ? Math.max(0, Math.min(100, data[i])) : Math.max(0, data[i]);
            var yy = CH_PAD_T + ph - (v / span) * ph;
            if (x0 === null) x0 = x;
            xl = x;
            pts.push(x.toFixed(1) + ' ' + yy.toFixed(1));
        }
        if (pts.length === 1) { pts.unshift(pts[0]); x0 = xl - 2; }
        var line = 'M' + pts.join(' L');
        var bottom = (CH_PAD_T + ph).toFixed(1);
        // 多条线时不要填色：两片半透明叠在一起糊成一团，底下的线也看不见了
        if (series[k].fill !== false) {
            out.push('<path class="area ' + cls + '" d="' + line + ' L' + xl.toFixed(1) + ' ' +
                     bottom + ' L' + x0.toFixed(1) + ' ' + bottom + ' Z"></path>');
        }
        out.push('<path class="line ' + cls + '" d="' + line + '"></path>');
    }
    out.push('<text x="' + CH_PAD_L + '" y="' + (h - 4) + '">2 分钟前</text>');
    out.push('<text x="' + (CH_PAD_L + pw) + '" y="' + (h - 4) +
             '" text-anchor="end">现在</text>');
    el.innerHTML = out.join('');
    return true;
}

function drawChart(el, data, cls) { return drawChartPx(el, [{ d: data, cls: cls }], true); }
// 磁盘读写速率没有固定上限，量程跟着峰值走；读一条、写一条
function drawChartMax(el, data, cls) { return drawChartPx(el, [{ d: data, cls: cls }], false); }
function drawChartPair(el, rd, wr) {
    return drawChartPx(el, [{ d: rd, cls: '', fill: false },
                            { d: wr, cls: 'w2', fill: false }], false);
}

// 每核方框里的迷你曲线：按像素画，但没有刻度（框只有 50px 高）。
function drawMini(el, data, cls) {
    var size = chSize(el);
    if (size.w < 20 || size.h < 10) return false;
    var w = size.w, h = size.h, pad = 1.5;
    el.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
    if (!data.length) { el.innerHTML = ''; return true; }
    var step = w / (HISTORY - 1);
    var pts = [], x0 = null, xl = null;
    for (var i = 0; i < data.length; i++) {
        var x = w - (data.length - 1 - i) * step;
        var v = Math.max(0, Math.min(100, data[i])) / 100;
        var y = (h - pad) - v * (h - 2 * pad);
        if (x0 === null) x0 = x;
        xl = x;
        pts.push(x.toFixed(1) + ' ' + y.toFixed(1));
    }
    if (pts.length === 1) { pts.unshift(pts[0]); x0 = xl - 2; }
    var line = 'M' + pts.join(' L');
    var bottom = (h - pad).toFixed(1);
    el.innerHTML = '<path class="area ' + cls + '" d="' + line + ' L' + xl.toFixed(1) + ' ' +
                   bottom + ' L' + x0.toFixed(1) + ' ' + bottom + ' Z"></path>' +
                   '<path class="line ' + cls + '" d="' + line + '"></path>';
    return true;
}

// ---------- 条目切换：条目与详情按 data-tab 配对 ----------
var curTab = 'cpu';

function selectTab(name) {
    curTab = name;
    Array.prototype.forEach.call(document.querySelectorAll('.tm-item'), function (it) {
        it.classList.toggle('on', it.dataset.tab === name);
    });
    Array.prototype.forEach.call(document.querySelectorAll('.tm-detail'), function (d) {
        d.classList.toggle('on', d.dataset.tab === name);
    });
    // 画哪张图由 drawHistories 按 curTab 决定：刚显示出来的详情才有尺寸，
    // 隐藏时画不了（setChart 会拒绝并留下"没画成"的签名）。
    if (name === 'cpu') layoutCores();
    drawHistories();
}

Array.prototype.forEach.call(document.querySelectorAll('.tm-item[data-tab]'), function (b) {
    b.addEventListener('click', function () { selectTab(b.dataset.tab); });
});

// ---------- CPU 视图：总利用率 / 逻辑处理器 二选一 ----------
// 两样同时画（大曲线 + 每核小格）一屏挤不下，曲线被压到没有高度。
// 切换只留一个，省下来的地方全给这张图。
var cpuMode = 'total';

// 每核方格的排布：按可用宽高算列数与行高，让它们铺满这块地方，
// 而不是在核少的时候挤在上半截、留一大片空。长度用设计像素算，再折算回 rem。
function layoutCores() {
    var box = document.getElementById('cpuCores');
    if (!box) return;
    var n = box.children.length;
    if (!n) return;
    var w = box.clientWidth, h = box.clientHeight;
    if (!w || !h) return;
    var root = parseFloat(getComputedStyle(document.documentElement).fontSize) || 1;
    var GAP = 8, MIN_W = 420, MIN_H = 96, MAX_H = 420;      // 都是设计像素
    var gapPx = GAP * root;
    var maxRows = Math.max(1, Math.floor((h + gapPx) / ((MIN_H + GAP) * root)));
    var cols = Math.max(1, Math.floor((w + gapPx) / ((MIN_W + GAP) * root)));
    cols = Math.min(n, Math.max(cols, Math.ceil(n / maxRows)));
    var rows = Math.ceil(n / cols);
    var rowH = (h - gapPx * (rows - 1)) / rows;
    rowH = Math.min(rowH, MAX_H * root);
    box.style.gridTemplateColumns = 'repeat(' + cols + ', minmax(0, 1fr))';
    box.style.gridAutoRows = (rowH / root).toFixed(2) + 'rem';
}

function setCpuMode(mode) {
    cpuMode = (mode === 'core') ? 'core' : 'total';
    Array.prototype.forEach.call(document.querySelectorAll('#cpuMode button'), function (b) {
        b.classList.toggle('on', b.dataset.mode === cpuMode);
    });
    document.getElementById('cpuViewTotal').hidden = cpuMode !== 'total';
    document.getElementById('cpuViewCore').hidden = cpuMode !== 'core';
    // 与切条目同一套口径：刚显示出来的容器才有尺寸。画不了的图不会写签名，
    // 所以切换时把两边的签名都清掉，谁露出来谁重画。
    layoutCores();
    forget('cpuBig');
    forget('coremini');
    drawHistories();
}

Array.prototype.forEach.call(document.querySelectorAll('#cpuMode button'), function (b) {
    b.addEventListener('click', function (e) {
        e.stopPropagation();          // 别把点击冒泡成"切条目"
        setCpuMode(b.dataset.mode);
    });
});

// 换分辨率后格子要重新排：行高是按可用高度算出来的
addEventListener('resize', function () {
    if (curTab !== 'cpu' || cpuMode !== 'core') return;
    layoutCores();
    forget('coremini');
    drawHistories();
});

// ---------- 键盘 ----------
// 上下键换条目（焦点跟着走），左右键在左列与右详情之间跳，Esc 回文件浏览。
// 这一页在 kiosk 上是整屏的，没有鼠标也必须能用。
function visibleItems() {
    return Array.prototype.filter.call(document.querySelectorAll('.tm-item'),
        function (it) { return it.offsetParent !== null; });
}

function currentIndex(items) {
    for (var i = 0; i < items.length; i++) {
        if (items[i] === document.activeElement) return i;
        if (items[i].dataset.tab === curTab) var sel = i;
    }
    return typeof sel === 'number' ? sel : 0;
}

function stepItem(delta) {
    var items = visibleItems();
    if (!items.length) return;
    var i = currentIndex(items) + delta;
    if (i < 0) i = 0;
    if (i > items.length - 1) i = items.length - 1;
    items[i].focus();
    selectTab(items[i].dataset.tab);
}

document.addEventListener('keydown', function (e) {
    var t = e.target || {};
    var tag = (t.tagName || '').toLowerCase();
    // 输入框、下拉框里的方向键归它们自己（时区、无线密码）
    if (tag === 'input' || tag === 'select' || tag === 'textarea' || t.isContentEditable) return;
    if (e.ctrlKey || e.altKey || e.metaKey) return;

    if (e.key === 'ArrowDown') { e.preventDefault(); stepItem(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); stepItem(-1); }
    else if (e.key === 'Home' || e.key === 'End') {
        var items = visibleItems();
        if (!items.length) return;
        e.preventDefault();
        var pick = items[e.key === 'Home' ? 0 : items.length - 1];
        pick.focus();
        selectTab(pick.dataset.tab);
    } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        var cur = document.querySelector('.tm-item[data-tab="' + curTab + '"]');
        if (cur) cur.focus();
    } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        var pane = document.getElementById('tmDetail');
        if (pane) { pane.tabIndex = -1; pane.focus(); }
    } else if (e.key === 'Escape') {
        // 详情里开着无线密码框时先关它，别一按 Esc 就整页走掉
        var form = document.querySelector('.wifi-form');
        if (form) { form.remove(); return; }
        location.href = '/';
    }
});

// ---------- CPU ----------
// 数据到达只更新"当前值"，历史一律在 advanceHistories() 里按帧推进。
// 以前历史跟着"这个键到了"推进，而服务端只发变过的键 —— 空闲时那一系列不动，
// 曲线就停住，看着像卡死。
var lastCpu = null;

function renderCpu(cpu) {
    lastCpu = cpu;
    var total = cpu.total || 0;
    var peak = Math.max.apply(null, hist.cpu.concat([total]));
    var lv = level(total, 75, 90);

    setText('stkCpuPv', total.toFixed(0) + '%');
    setText('cpuUse', total.toFixed(1) + ' %');
    setText('cpuPeak2', peak.toFixed(0) + ' %');

    var cores = cpu.cores || [];
    var mhz = cpu.cores_mhz || [];
    var box = document.getElementById('cpuCores');
    if (box.children.length !== cores.length) {
        box.innerHTML = '';
        hist.cores = [];
        cores.forEach(function (v, i) {
            var d = document.createElement('div');
            d.className = 'tm-core';
            // 频率贴在核名后面：一行里「CPU 0  2.41 GHz」左边、「41%」右边
            d.innerHTML = '<span class="n">CPU ' + i + '<b class="mhz"></b></span>' +
                          '<span class="v"></span>' +
                          '<svg class="mini" viewBox="0 0 100 40" preserveAspectRatio="none"></svg>';
            box.appendChild(d);
            hist.cores.push([]);
        });
        forget('coretxt');
        forget('coremini');
        forget('corefreq');
        if (cpuMode === 'core') layoutCores();
    }
    cores.forEach(function (v, i) {
        var d = box.children[i];
        if (!d) return;
        setNodeText(d.querySelector('.v'), 'coretxt' + i, v.toFixed(0) + '%');
        // 没有就留空：读不到频率的机器（非 x86）不编一个数上去
        setNodeText(d.querySelector('.mhz'), 'corefreq' + i, freqText(mhz[i]));
    });
}

// 每核频率的写法：读不到就是空串（非 x86 的机器 /proc/cpuinfo 没有这一行）
function freqText(mhz) {
    if (!mhz) return '';
    return mhz >= 1000 ? (mhz / 1000).toFixed(2) + ' GHz' : mhz + ' MHz';
}

// ---------- 内存 ----------
var MEM_PARTS = [
    ['进程', 'anon', 'var(--primary, #34d399)'],
    ['共享内存', 'shmem', 'var(--success, #34d399)'],
    ['缓存', 'cache', 'var(--warn, #f5b74e)'],
    ['内核', 'kernel', 'var(--danger, #ef6461)'],
    ['其他', 'other', 'var(--text-light, #9aa4b2)'],
    ['空闲', 'free', '#3a3a3a']
];

var lastMem = null;

function renderMemory(m) {
    lastMem = m;
    var total = m.total || 1;

    setText('stkMemPv', (m.percent || 0) + '%');
    setText('memUsed', fmtBytes(m.used));
    setText('memAvail', fmtBytes(m.available));
    setText('memTotal2', fmtBytes(m.total));
    setText('memPct2', (m.percent || 0) + ' %');
    setText('memCache', fmtBytes(m.cache));
    setText('memKernel', fmtBytes(m.kernel));
    setText('memShmem', fmtBytes(m.shmem));
    setText('memSwap', m.swap_total
        ? fmtBytes(m.swap_used) + ' / ' + fmtBytes(m.swap_total)
        : '未启用');
    setText('memSub', fmtBytes(m.total) + ' 总计');

    // 组成条的分母用各块之和，而不是 MemTotal：六块本来就该加满整条，
    // 后端口径一变（多一块、少一块）也不会在条子末端留一截底色。
    var sum = 0;
    MEM_PARTS.forEach(function (p) { sum += m[p[1]] || 0; });

    var stack = document.getElementById('memStack');
    var legend = document.getElementById('memLegend');
    if (stack.children.length !== MEM_PARTS.length) {
        stack.innerHTML = '';
        legend.innerHTML = '';
        MEM_PARTS.forEach(function (p) {
            stack.appendChild(document.createElement('i'));
            var row = document.createElement('div');
            row.className = 'n';
            row.innerHTML = '<i></i><span></span>';
            legend.appendChild(row);
            var vRow = document.createElement('div');
            vRow.className = 'v';
            legend.appendChild(vRow);
        });
        forget('memseg');
        forget('memleg');
    }
    MEM_PARTS.forEach(function (p, i) {
        var val = m[p[1]] || 0;
        var pct = sum > 0 ? val / sum * 100 : 0;
        var sig = p[2] + '|' + pct.toFixed(2);
        if (_wrote['memseg' + i] !== sig) {
            _wrote['memseg' + i] = sig;
            var seg = stack.children[i];
            seg.style.width = pct.toFixed(2) + '%';
            seg.style.background = p[2];
            seg.title = p[0] + ' ' + fmtBytes(val);
        }
        var row = legend.children[i * 2];
        if (row) {
            row.querySelector('i').style.background = p[2];
            setNodeText(row.querySelector('span'), 'memlegn' + i, p[0]);
        }
        var vRow = legend.children[i * 2 + 1];
        if (vRow) setNodeText(vRow, 'memlegv' + i, fmtBytes(val) + '（' + pct.toFixed(0) + '%）');
    });
}

// ---------- 服务 ----------
var SVC_CLASS = { active: 'tag tag-local', failed: 'tag tag-gone', inactive: 'tag', activating: 'tag tag-coded' };
var _svc = {}, _svcPlaceholder = false;

// 累计 CPU 时间（纳秒）→ 人读的时长。这是单元从启动到现在烧掉的 CPU，
// 不是瞬时占比：占比要按拍差分，而慢档 30 秒一档的差分说明不了谁在占 CPU。
function fmtCpuNs(ns) {
    if (!ns) return '-';
    var s = ns / 1e9;
    if (s < 60) return s.toFixed(1) + ' s';
    var m = Math.floor(s / 60);
    if (m < 60) return m + ' 分 ' + Math.round(s % 60) + ' 秒';
    return Math.floor(m / 60) + ' 时 ' + (m % 60) + ' 分';
}

function syncServices(list) {
    var box = document.getElementById('svcList');
    list = list || [];
    if (list.length && box.querySelector('.ph')) { box.innerHTML = ''; _svcPlaceholder = false; }
    if (!list.length) {
        if (!_svcPlaceholder) {
            box.innerHTML = '<div class="srow ph"><span class="srow-path">没有可显示的服务</span></div>';
            _svcPlaceholder = true;
        }
        setText('stkSvcPv', '-');
        return;
    }
    var seen = {}, running = 0;
    list.forEach(function (s) {
        seen[s.name] = true;
        if (s.state === 'active') running++;
        var n = _svc[s.name];
        if (!n) {
            var row = document.createElement('div');
            row.className = 'tm-svc';
            row.innerHTML = '<span class="n"></span><span class="tag"></span>' +
                            '<span class="m"></span><span class="c"></span><span class="p"></span>';
            box.appendChild(row);
            n = _svc[s.name] = {
                row: row, name: row.querySelector('.n'), tag: row.querySelector('.tag'),
                mem: row.querySelector('.m'), cpu: row.querySelector('.c'),
                pid: row.querySelector('.p')
            };
        }
        setNodeText(n.name, 'svcn' + s.name, s.name);
        var cls = SVC_CLASS[s.state] || 'tag tag-coded';
        if (_wrote['svcc' + s.name] !== cls) { _wrote['svcc' + s.name] = cls; n.tag.className = cls; }
        setNodeText(n.tag, 'svct' + s.name, s.state);
        setNodeText(n.mem, 'svcm' + s.name, s.memory ? fmtBytes(s.memory) : '-');
        setNodeText(n.cpu, 'svcu' + s.name, fmtCpuNs(s.cpu_ns));
        setNodeText(n.pid, 'svcp' + s.name, s.pid ? String(s.pid) : '-');
    });
    Object.keys(_svc).forEach(function (name) {
        if (seen[name]) return;
        _svc[name].row.remove();
        delete _svc[name];
    });
    setText('stkSvcPv', running + ' / ' + list.length + ' 运行');
    setText('svcSub', running + ' / ' + list.length + ' 正在运行');
}

var _proc = {}, _procSig = '';

function renderProcs(list) {

function fmtRate(bps) {
    if (!bps) return '0';
    var u = ['B/s', 'KB/s', 'MB/s', 'GB/s'], i = 0;
    while (bps >= 1024 && i < u.length - 1) { bps /= 1024; i++; }
    return (bps >= 100 ? bps.toFixed(0) : bps.toFixed(1)) + ' ' + u[i];
}

// ---------- 磁盘：一块盘一个条目 + 一份详情 ----------
var _disks = {}, _diskPlaceholder = false;

// 盘的类型。USB 盘要单独认出来：很多 U 盘把 queue/rotational 报成 1，
// 只看那个字段会把它写成"机械盘"（后端按设备路径判，见 host._disk_bus）。
// 接口（总线）也是后端给的：sda 既可能是 SATA 也可能是 USB，只有 /sys 那条链路知道。
var DISK_BUS = { nvme: 'NVMe', sata: 'SATA', virtio: 'virtio', mmc: 'SD 卡', usb: 'USB' };

function diskKind(d) {
    if (d.usb) return 'USB 盘';
    if (d.removable) return '移动盘';
    var kind = d.rotational ? '机械盘' : '固态盘';
    var bus = DISK_BUS[d.bus];
    return bus ? (kind + ' · ' + bus) : kind;
}

// 条目上那行小字：类型 + 型号（型号只在盘自己报得出来、且不是设备名时才写）
function diskSub(d) {
    var model = (d.model || '').trim();
    return diskKind(d) + (model && model !== d.name ? ' · ' + model : '');
}

function diskItem(name, label) {
    var b = document.createElement('button');
    b.className = 'tm-item disk';
    b.type = 'button';
    b.dataset.tab = 'disk:' + name;
    b.dataset.disk = name;
    b.innerHTML = '<span class="nm"></span><span class="pv">-</span>' +
                  '<span class="sub"></span>' +
                  '<svg class="spark" viewBox="0 0 100 22" preserveAspectRatio="none"></svg>';
    b.querySelector('.nm').textContent = label;
    b.addEventListener('click', function () { selectTab('disk:' + name); });
    return b;
}

function diskDetail(name, label) {
    var s = document.createElement('section');
    s.className = 'tm-detail';
    s.dataset.disk = name;
    s.dataset.tab = 'disk:' + name;
    s.innerHTML =
        '<div class="tm-hd"><h2></h2>' +
        '<span class="dlegend"><i class="c-rd"></i>读<i class="c-wr"></i>写</span>' +
        '<span class="sub"></span></div>' +
        '<svg class="tm-chart" viewBox="0 0 100 40" preserveAspectRatio="none"></svg>' +
        '<div class="tm-cols">' +
        '  <div class="tm-table">' +
        '    <div class="tm-row"><span class="k">型号</span><span class="v mdl">-</span></div>' +
        '    <div class="tm-row"><span class="k">容量</span><span class="v cap">-</span></div>' +
        '    <div class="tm-row"><span class="k">类型</span><span class="v kind">-</span></div>' +
        '    <div class="tm-row"><span class="k">繁忙</span><span class="v busy">-</span></div>' +
        '    <div class="tm-row"><span class="k">读取</span><span class="v rd">-</span></div>' +
        '    <div class="tm-row"><span class="k">写入</span><span class="v wr">-</span></div>' +
        '    <div class="tm-row"><span class="k">IOPS（读 / 写）</span><span class="v iops">-</span></div>' +
        '  </div>' +
        '  <div class="tm-side"><h3>分区</h3><div class="parts"></div></div>' +
        '</div>';
    s.querySelector('h2').textContent = label;
    s.querySelector('.sub').textContent = name;
    s.querySelector('svg').id = 'diskChart-' + name;
    document.getElementById('tmDetail').appendChild(s);
    return {

        rd: s.querySelector('.rd'), wr: s.querySelector('.wr'),
        iops: s.querySelector('.iops'),

        rows: {}
    };
}

function diskPartRow(box, pname) {
    var row = document.createElement('div');
    row.className = 'tm-part';
    row.innerHTML = '<span class="pname"></span><span class="pmeta"></span>' +
                    '<span class="pbar"><i></i></span><span class="puse"></span>';
    box.appendChild(row);
    return {
        row: row,
        pname: row.querySelector('.pname'),
        pmeta: row.querySelector('.pmeta'),
        fill: row.querySelector('.pbar > i'),
        puse: row.querySelector('.puse')
    };
}

function syncDisks(list) {
    var stackBox = document.getElementById('stkDisks');
    list = list || [];
    if (list.length && stackBox.querySelector('.ph')) { stackBox.innerHTML = ''; _diskPlaceholder = false; }
    if (!list.length) {
        if (!_diskPlaceholder) {
            stackBox.innerHTML = '<div class="srow ph"><span class="srow-path">没有检测到磁盘</span></div>';
            _diskPlaceholder = true;
        }
        return;
    }

    var seen = {};
    list.forEach(function (d, idx) {
        seen[d.name] = true;
        var label = '磁盘 ' + idx + '（' + d.name + '）';
        var n = _disks[d.name];
        if (!n) {
            var item = diskItem(d.name, label);
            stackBox.appendChild(item);
            n = _disks[d.name] = { item: item, pv: item.querySelector('.pv'),
                                   sub: item.querySelector('.sub'),
                                   spark: item.querySelector('.spark') };
            n.detail = diskDetail(d.name, label);
        }
        n.item.querySelector('.nm').textContent = label;
        setNodeText(n.sub, 'dsub' + d.name, diskSub(d));

        var parts = d.partitions || [];
        setNodeText(n.detail.mdl, 'dmdl' + d.name, d.model || '-');
        setNodeText(n.detail.cap, 'dcap' + d.name, fmtBytes(d.size));
        setNodeText(n.detail.kind, 'dkind' + d.name, diskKind(d));

        var pseen = {};
        parts.forEach(function (p) {
            pseen[p.name] = true;
            var r = n.detail.rows[p.name] || (n.detail.rows[p.name] = diskPartRow(n.detail.parts, p.name));
            setNodeText(r.pname, 'dp-name-' + p.name, p.name);
            setNodeText(r.pmeta, 'dp-meta-' + p.name, (p.fstype || '—') +
                        (p.mount ? ' → ' + p.mount : '') + (p.readonly ? ' · 只读' : ''));
            if (p.total) {
                var pct = Math.min(100, p.percent);
                var sig = pct + '|' + p.percent;
                if (_wrote['dpbar-' + p.name] !== sig) {
                    _wrote['dpbar-' + p.name] = sig;
                    r.fill.style.width = pct + '%';
                    r.fill.className = p.percent >= 90 ? 'danger' : '';
                }
                setNodeText(r.puse, 'dp-use-' + p.name,
                            fmtBytes(p.used) + ' / ' + fmtBytes(p.total) + '（' + p.percent + '%）');
            } else {
                setNodeText(r.puse, 'dp-use-' + p.name,
                            p.mount ? '容量未知' : (p.fstype ? '未挂载' : '无文件系统'));
            }
        });
        Object.keys(n.detail.rows).forEach(function (pname) {
            if (pseen[pname]) return;
            n.detail.rows[pname].row.remove();
            delete n.detail.rows[pname];
        });

        if (curTab === 'disk:' + d.name) {
            var hh = histIo[d.name] || { rd: [], wr: [] };
            setChart2('diskBig' + d.name, n.detail.chart, hh.rd, hh.wr, drawChartPair);
        }
    });

    Object.keys(_disks).forEach(function (name) {
        if (seen[name]) return;
        _disks[name].item.remove();
        _disks[name].detail.sec.remove();
        delete _disks[name];
        if (curTab === 'disk:' + name) selectTab('cpu');
    });
}

// io 只更新"当前值"，历史在 advanceHistories() 里按帧推进（见文件后面的说明）。
function renderIo(io) {
    lastIo = io || {};

function renderIoLists() {
    Object.keys(_disks).forEach(function (name) {
        var n = _disks[name], x = lastIo[name];

        setNodeText(n.pv, 'diskPv' + name, Math.round(busy) + '%');

        setNodeText(n.detail.wr, 'diskw' + name, x ? fmtRate(x.write_bps) : '-');
        setNodeText(n.detail.iops, 'diski' + name, x
            ? (x.read_iops || 0).toFixed(0) + ' / ' + (x.write_iops || 0).toFixed(0) : '-');
    });
}

// ---------- 网络速率（收发） ----------
var lastNet = {};
var histNet = {};
var netIf = '';

function renderNet(map) {
    lastNet = map || {};
    Object.keys(lastNet).forEach(function (k) {
        if (!histNet[k]) histNet[k] = { rx: [], tx: [] };
    });
    // 显示哪块网卡：优先无线报上来的那块，否则挑当前流量最大的那块
    var pick = netIf && lastNet[netIf] ? netIf : '';
    if (!pick) {
        var best = -1;
        Object.keys(lastNet).forEach(function (k) {
            var v = (lastNet[k].rx_bps || 0) + (lastNet[k].tx_bps || 0);
            if (v > best) { best = v; pick = k; }
        });
    }
    if (!pick) return;
    netIf = pick;
    var x = lastNet[pick] || {};
    setText('netRx', fmtRate(x.rx_bps || 0));
    setText('netTx', fmtRate(x.tx_bps || 0));
    setText('netIfName', pick);
}

// ---------- 无线网络 ----------
var wifiNets = [];
var WIFI_STATE = {
    COMPLETED: '已连接', SCANNING: '扫描中', ASSOCIATING: '关联中', ASSOCIATED: '已关联',
    AUTHENTICATING: '认证中', AUTHENTICATED: '已认证', DISCONNECTED: '未连接',
    INACTIVE: '未连接', INTERFACE_DISABLED: '接口关闭'
};

function renderWifi(s) {
    s = s || {};
    if (s.error) {
        setText('stkNetPv', '读取失败');
        setText('wifiNow', '读取失败');
        setText('wifiIp', s.error);
        return;
    }
    var state = WIFI_STATE[s.state] || s.state || '-';
    var connected = (s.state === 'COMPLETED') || !!s.ip;
    setText('stkNetPv', connected ? (s.ssid || '已连接') : state);
    setText('wifiNow', connected ? ('已连接 · ' + (s.ssid || '')) : state);
    setText('wifiIp', s.ip || '-');
    setText('wifiBssid', s.bssid || '-');
    setText('wifiFreq', s.freq ? s.freq + ' MHz' : '-');
    setText('netSub', s.interface || '');
}

function wifiSecurityLabel(sec) {
    return { open: '开放', wep: 'WEP', wpa: 'WPA', wpa2: 'WPA2', wpa3: 'WPA3' }[sec] || sec || '未知';
}

function renderWifiList() {
    var box = document.getElementById('wifiList');
    box.innerHTML = '';
    if (!wifiNets.length) {
        box.innerHTML = '<div class="srow"><span class="srow-path">没有扫到网络</span></div>';
        return;
    }
    wifiNets.forEach(function (n) {
        var bars = n.signal >= -55 ? '▂▄▆█' : n.signal >= -70 ? '▂▄▆' : n.signal >= -80 ? '▂▄' : '▂';
        var row = document.createElement('div');
        row.className = 'srow';
        row.style.cursor = 'pointer';
        row.innerHTML = '<span class="srow-name">' + esc(n.ssid) + '</span>' +
            '<span class="srow-path">' + esc(wifiSecurityLabel(n.security)) +
            (n.saved ? ' · 已保存' : '') + '</span>' +
            '<span class="srow-path">' + bars + ' ' + n.signal + '</span>';
        row.addEventListener('click', function () { wifiForm(row, n); });
        keyActivate(row, function () { wifiForm(row, n); }, '连接 ' + n.ssid);
        box.appendChild(row);
    });
}

function wifiForm(row, net) {
    if (row.querySelector('.wifi-form')) return;
    var form = document.createElement('div');
    form.className = 'wifi-form';
    form.style.cssText = 'display:flex;gap:6rem;margin:6rem 0 2rem;align-items:center';
    var locked = net.security !== 'open';
    form.innerHTML = (locked ? '<input class="wifi-input" type="password" placeholder="密码（8~63 位）">' : '') +
        '<button class="btn btn-sm btn-primary" type="button">连接</button>' +
        '<button class="btn btn-sm" type="button">取消</button>';
    var input = form.querySelector('input');
    var btns = form.querySelectorAll('button');
    btns[0].addEventListener('click', function () {
        btns[0].disabled = true;
        btns[0].textContent = '连接中…';
        fetch('/api/wifi/connect', {
            method: 'POST', credentials: 'same-origin',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ ssid: net.ssid, psk: input ? input.value : '' })
        }).then(function (r) {
            return r.json().then(function (d) { return { ok: r.ok, d: d }; });
        }).then(function (res) {
            if (res.ok) { form.remove(); row.style.cursor = 'pointer'; row.focus(); }
            // 慢档不会立刻变：重订阅一次，服务端会马上回一帧全量
            resubscribe();
        }).catch(function () {}).then(function () {
            btns[0].disabled = false;
            btns[0].textContent = '连接';
        });
    });
    btns[1].addEventListener('click', function () { form.remove(); row.style.cursor = 'pointer'; row.focus(); });
    row.appendChild(form);
    row.style.cursor = 'default';
    if (input) {
        input.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') { e.preventDefault(); btns[0].click(); }
            else if (e.key === 'Escape') { e.preventDefault(); btns[1].click(); }
        });
        input.focus();
    } else {
        btns[0].focus();
    }
}

function scanWifi() {
    var hint = document.getElementById('wifiHint');
    var btn = document.getElementById('wifiScanBtn');
    btn.disabled = true;
    hint.textContent = '扫描中…（约 4 秒）';
    fetch('/api/wifi/scan', { credentials: 'same-origin' }).then(function (r) {
        if (!r.ok) throw new Error('bad');
        return r.json();
    }).then(function (d) {
        wifiNets = d.networks || [];
        renderWifiList();
        hint.textContent = wifiNets.length ? ('找到 ' + wifiNets.length + ' 个') : '没有扫到';
    }).catch(function () {
        hint.textContent = '扫描失败';
    }).then(function () { btn.disabled = false; });
}
document.getElementById('wifiScanBtn').addEventListener('click', scanWifi);

// ---------- 时区 ----------
var TZ_CN = {
    'Asia/Shanghai': '中国 · 北京（Asia/Shanghai）',
    'Asia/Urumqi': '中国 · 乌鲁木齐（Asia/Urumqi）',
    'Asia/Chongqing': '中国 · 重庆（Asia/Chongqing）',
    'Asia/Harbin': '中国 · 哈尔滨（Asia/Harbin）',
    'Asia/Kashgar': '中国 · 喀什（Asia/Kashgar）',
    'Asia/Hong_Kong': '中国香港（Asia/Hong_Kong）',
    'Asia/Macau': '中国澳门（Asia/Macau）',
    'Asia/Taipei': '中国台湾（Asia/Taipei）',
    'Asia/Singapore': '新加坡（Asia/Singapore）',
    'UTC': '协调世界时（UTC）'
};

function loadTimezones() {
    fetch('/api/system/timezones', { credentials: 'same-origin' }).then(function (r) {
        return r.json();
    }).then(function (d) {
        var sel = document.getElementById('tzSelect');
        if (!sel || !d || !d.timezones) return;
        // 读不到当前时区（镜像里没写、或 statics 还没到）时按北京时间选 ——
        // 这一页的使用场景就是国内设备，落到 UTC 上等于让人以为时间错了。
        var current = d.current || 'Asia/Shanghai';
        var all = d.timezones.slice();
        if (all.indexOf(current) < 0) all.unshift(current);
        sel.innerHTML = '';
        var common = document.createElement('optgroup');
        common.label = '常用';
        Object.keys(TZ_CN).forEach(function (z) {
            if (all.indexOf(z) >= 0) {
                var o = document.createElement('option');
                o.value = z;
                o.textContent = TZ_CN[z];
                if (z === current) o.selected = true;
                common.appendChild(o);
            }
        });
        sel.appendChild(common);
        var rest = document.createElement('optgroup');
        rest.label = '全部时区';
        all.forEach(function (z) {
            if (TZ_CN[z]) return;
            var o = document.createElement('option');
            o.value = z;
            o.textContent = z;
            if (z === current) o.selected = true;
            rest.appendChild(o);
        });
        sel.appendChild(rest);
        sel.value = current;
    }).catch(function () {});
}

document.getElementById('tzSelect').addEventListener('change', function () {
    var sel = this;
    sel.disabled = true;
    fetch('/api/system/timezone', {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ timezone: sel.value })
    }).then(function (r) { return r.json(); }).then(function (d) {
        if (d && d.ok) {
            location.reload();
        } else {
            alert((d && d.error) || '设置时区失败');
            sel.disabled = false;
        }
    }).catch(function () {
        alert('设置时区失败');
        sel.disabled = false;
    });
});

// ---------- 数据通道：进页面取一次全量，之后靠推送 ----------
var WS_PORT = window.__WS_PORT__ || 8081;
var bootAt = 0;
var sock = null, retryMs = 0, pollTimer = 0;

function wsUrl() {
    var proto = (location.protocol === 'https:') ? 'wss:' : 'ws:';
    return proto + '//' + location.hostname + ':' + WS_PORT + '/';
}

function refreshSummary(host, load) {
    host = host || {};
    if (host.name !== undefined) setText('rowHost', host.name || '-');
    if (host.kernel !== undefined) setText('rowKernel', host.kernel || '-');
    if (host.arch !== undefined || host.cores !== undefined) {
        setText('rowArch', (host.arch || '-') + ' / ' + (host.cores || 0) + ' 核');
        setText('cpuCoresN', String(host.cores || 0));
        setText('cpuSub', (host.arch || '') + ' · ' + (host.cores || 0) + ' 个逻辑处理器');
    }
    if (load) {
        var s = [load.l1, load.l5, load.l15].filter(Boolean).join(' / ') || '-';
        setText('rowLoad', s);
        setText('cpuLoad2', s);
    }
    if (bootAt) {
        setText('rowBoot', fmtTime(bootAt));
        var up = fmtUptime(Math.max(0, Math.floor(Date.now() / 1000) - bootAt));
        setText('rowUptime', up);
        setText('cpuUptime2', up);
    }
}

var WRITERS = {
    host: function (h) { refreshSummary(h, null); },
    load: function (l) { refreshSummary(null, l); },
    cpu: renderCpu,
    mem: renderMemory,
    temp: renderTemps,
    io: renderIo,
    disks: function (list) { syncDisks(list); renderIoLists(); },
    services: syncServices,
    procs: renderProcs,
    net: renderNet,
    wifi: renderWifi
};

function applyFrame(d) {
    d = d || {};
    if (typeof d.boot_at === 'number' && d.boot_at) bootAt = d.boot_at;
    Object.keys(WRITERS).forEach(function (k) {
        if (d[k] === undefined) return;
        WRITERS[k](d[k]);
    });
    pingFrame();
}

function applyDelta(set) {
    if (!set) return;
    arrived = {};
    Object.keys(set).forEach(function (k) {
        arrived[k] = 1;
        var fn = WRITERS[k];
        if (fn) fn(set[k]);
    });
    pingFrame();
}

// 这一帧带了哪些键。曲线只按"这一帧真的有这个数据"推进 —— 服务端对
// cpu/mem/io/net 每秒都带，所以不会断；拿上一帧的值补格是在编数据。
var arrived = {};

function pingFrame() {
    if (bootAt) refreshSummary(null, null);
    advanceHistories();
}

function pushSample(arr, v) {
    arr.push(v);
    if (arr.length > HISTORY) arr.shift();
}

function advanceHistories() {
    var i;
    if (lastCpu && arrived.cpu) {
        pushSample(hist.cpu, lastCpu.total || 0);
        var cores = lastCpu.cores || [];
        for (i = 0; i < cores.length; i++) {
            if (!hist.cores[i]) hist.cores[i] = [];
            pushSample(hist.cores[i], cores[i]);
        }
    }
    if (lastMem && arrived.mem) pushSample(hist.mem, lastMem.percent || 0);
    if (arrived.io) {
        Object.keys(histIo).forEach(function (k) {
            var x = lastIo[k] || {};
            pushSample(histIo[k].rd, x.read_bps || 0);
            pushSample(histIo[k].wr, x.write_bps || 0);
        });
    }
    if (arrived.net) {
        Object.keys(histNet).forEach(function (k) {
            var x = lastNet[k] || {};
            pushSample(histNet[k].rx, x.rx_bps || 0);
            pushSample(histNet[k].tx, x.tx_bps || 0);
        });
    }
    drawHistories();
}

function drawHistories() {
    if (lastCpu) {
        var lv = level(lastCpu.total || 0, 75, 90);
        setChart('cpuSpark', document.getElementById('stkCpuSpark'), hist.cpu, lv, drawSpark);
        if (cpuMode === 'core') {
            var box = document.getElementById('cpuCores');
            (lastCpu.cores || []).forEach(function (v, i) {
                var d = box.children[i];
                if (d) setChart('coremini' + i, d.querySelector('.mini'),
                                hist.cores[i] || [], level(v, 75, 90), drawMini);
            });
        } else {
            setChart('cpuBig', document.getElementById('cpuChartBig'), hist.cpu, lv, drawChart);
        }
    }
    if (lastMem) {
        var mlv = level(lastMem.percent, 80, 92);
        setChart('memSpark', document.getElementById('stkMemSpark'), hist.mem, mlv, drawSpark);
        setChart('memBig', document.getElementById('memChartBig'), hist.mem, mlv, drawChart);
    }
    Object.keys(_disks).forEach(function (name) {
        var n = _disks[name];
        var h = histIo[name] || { rd: [], wr: [] };
        var total = h.rd.map(function (v, i) { return v + (h.wr[i] || 0); });
        var peak = Math.max.apply(null, total.concat([1]));
        var scaled = total.map(function (v) { return Math.min(100, v / peak * 100); });
        setChart('diskSpark' + name, n.spark, scaled, '', drawSpark);
        if (curTab === 'disk:' + name) {
            setChart2('diskBig' + name, n.detail.chart, h.rd, h.wr, drawChartPair);
        }
    });
    if (netIf) {
        var nh = histNet[netIf] || { rx: [], tx: [] };
        var nsum = nh.rx.map(function (v, i) { return v + (nh.tx[i] || 0); });
        var npeak = Math.max.apply(null, nsum.concat([1]));
        setChart('netSpark', document.getElementById('stkNetSpark'),
                 nsum.map(function (v) { return Math.min(100, v / npeak * 100); }),
                 '', drawSpark);
        if (curTab === 'net') {
            setChart2('netBig', document.getElementById('netChartBig'), nh.rx, nh.tx, drawChartPair);
        }
    }
}

function showReadError(why) {
    var s = '读取失败: ' + esc(String(why || '未知错误'));
    setNodeHtml(document.getElementById('svcList'), 'errSvc',
                '<div class="srow ph"><span class="srow-path c-danger-strong">' + s + '</span></div>');
    _svcPlaceholder = true;
    Object.keys(_svc).forEach(function (k) { delete _svc[k]; });
}

function fetchSnapshot() {
    fetch('/api/system', { credentials: 'same-origin' }).then(function (r) {
        if (!r.ok) throw new Error(r.status === 404 ? '没有权限读取本机状态' : ('HTTP ' + r.status));
        return r.json();
    }).then(applyFrame).catch(function (e) {
        showReadError(e && (e.message || e));
    });
}

function startPolling() {
    if (pollTimer) return;
    pollTimer = setInterval(function () {
        if (document.hidden) return;
        fetch('/api/system?scope=fast', { credentials: 'same-origin' })
            .then(function (r) { if (!r.ok) throw new Error('bad'); return r.json(); })
            .then(applyFrame)
            .catch(function () {});
    }, 1000);
}

function stopPolling() {
    if (pollTimer) { clearInterval(pollTimer); pollTimer = 0; }
}

function subscribe() {
    if (!sock || sock.readyState !== 1) return;
    sock.send(JSON.stringify({ type: 'system-sub' }));
}

function resubscribe() {
    if (!sock || sock.readyState !== 1) return;
    try {
        sock.send(JSON.stringify({ type: 'system-unsub' }));
        sock.send(JSON.stringify({ type: 'system-sub' }));
    } catch (e) { /* 断了就交给 onclose */ }
}

function connect() {
    try { sock = new WebSocket(wsUrl()); } catch (e) { return retryConnect(); }
    sock.onopen = function () {
        retryMs = 0;
        stopPolling();
        subscribe();
    };
    sock.onmessage = function (ev) {
        var m;
        try { m = JSON.parse(ev.data); } catch (e) { return; }
        if (m.type === 'system_snap') applyFrame(m.data);
        else if (m.type === 'system_delta') applyDelta(m.set);
    };
    sock.onclose = function () {
        sock = null;
        startPolling();
        retryConnect();
    };
    sock.onerror = function () { try { sock.close(); } catch (e) {} };
}

function retryConnect() {
    retryMs = Math.min(retryMs + 1, 10);
    setTimeout(connect, 1000 * retryMs);
}

// ---------- 启动 ----------
// 大图按像素画，容器一变尺寸就得重画（窗口拖动、最大化、桌面窗口改大小）。
var _rsTimer = 0;
window.addEventListener('resize', function () {
    clearTimeout(_rsTimer);
    _rsTimer = setTimeout(function () {
        forget('cpuBig'); forget('memBig'); forget('diskBig');
        selectTab(curTab);
    }, 200);
});

// 深链参数：`?tab=net` 直接落到对应的那一栏（托盘改弹面板之后暂时没人带这个参数，
// 但从别处链进来仍然好用）；非法值落回 CPU。
var _wantedTab = (function () {
    var m = /[?&]tab=([\w:.-]+)/.exec(location.search);
    if (!m) return 'cpu';
    var ok = Array.prototype.some.call(document.querySelectorAll('.tm-item[data-tab]'),
        function (it) { return it.dataset.tab === m[1]; });
    return ok ? m[1] : 'cpu';
})();
selectTab(_wantedTab);
loadTimezones();
fetchSnapshot();
connect();
</script>
