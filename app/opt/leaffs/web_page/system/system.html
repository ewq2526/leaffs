<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>系统</title>
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png?v=3">
<link rel="icon" type="image/png" sizes="192x192" href="/static/favicon.png?v=3">
<link rel="apple-touch-icon" href="/static/favicon.png?v=3">
<link rel="stylesheet" href="/static/style.css">
<script>window.__WS_PORT__=parseInt('__WS_PORT_NUM__',10)||8081;</script>
<style>
/* 系统页专用的几个小件：曲线、核格。只在本页生效，不往 style.css 里塞一次性样式。 */
.sys-chart { width: 100%; height: 34px; display: block; }
.sys-chart path.line { fill: none; stroke: var(--primary); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
.sys-chart path.area { fill: var(--primary); opacity: 0.14; stroke: none; }
.sys-chart path.line.warn { stroke: var(--warn); }
.sys-chart path.area.warn { fill: var(--warn); }
.sys-chart path.line.danger { stroke: var(--danger); }
.sys-chart path.area.danger { fill: var(--danger); }
.sys-cores { display: grid; grid-template-columns: repeat(auto-fit, minmax(64px, 1fr)); gap: 6px; }
.sys-core { font-size: 10.5px; color: var(--text-light); }
.sys-core .val { float: right; }
.sys-bar { height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; margin-top: 3px; }
.sys-bar > i { display: block; height: 100%; background: var(--primary); border-radius: 3px; transition: width 0.4s var(--ease); }
.sys-bar > i.warn { background: var(--warn); }
.sys-bar > i.danger { background: var(--danger); }
.sys-head { display: flex; align-items: baseline; gap: 8px; }
.sys-head .big { font-size: 20px; font-weight: 600; color: var(--text); }
.sys-head .unit { font-size: 11px; color: var(--text-light); }
.sys-head .spacer { flex: 1; }
/* 磁盘卡片：一块盘一张带框的卡，点标题展开详情 */
.disk-card { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; background: var(--card-bg); }
.disk-card:last-child { margin-bottom: 0; }
.disk-head { display: flex; align-items: baseline; gap: 8px; cursor: pointer; flex-wrap: wrap; }
.disk-head .name { font-weight: 600; font-size: 13px; color: var(--text); }
.disk-head .meta { font-size: 11px; color: var(--text-light); }
.disk-head .io { margin-left: auto; font-size: 11.5px; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
.disk-head .io b { font-weight: 600; color: var(--text); }
.disk-card .detail { display: none; margin-top: 8px; }
.disk-card.open .detail { display: block; }
.disk-chart-box { border: 1px solid var(--border); border-radius: 8px; padding: 4px 6px; margin: 8px 0 6px; }
.sys-chart path.grid { fill: none; stroke: var(--border); stroke-width: 1; stroke-dasharray: 2 3; vector-effect: non-scaling-stroke; }
.disk-part { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px solid var(--border); font-size: 11.5px; }
.disk-part:first-child { border-top: none; }
.disk-part .pname { font-weight: 600; color: var(--text); min-width: 52px; }
.disk-part .pmeta { color: var(--text-light); flex: 1 1 auto; word-break: break-all; }
.disk-part .puse { color: var(--text-secondary); font-variant-numeric: tabular-nums; white-space: nowrap; }
.disk-part .dl-progress-bar { width: 64px; flex: 0 0 64px; }
.wifi-input { flex: 1 1 auto; min-width: 0; background: var(--bg); color: var(--text);
                   border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px;
                   font-size: 12px; font-family: var(--font); }
.wifi-input:focus { outline: none; border-color: var(--primary); }
.sys-stack { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--border); margin-top: 6px; }
.sys-stack > i { display: block; height: 100%; }
</style>
</head>
<body>
<div class="app">
    <header class="top">
        <span class="top-logo"><img src="/static/logo.png" alt=""></span>
        <div class="top-main">
            <h1 class="top-title">系统</h1>
        </div>
        <div class="top-side"><!--THEME_TOGGLE--></div>
    </header>

    <nav class="tabs">
        <a href="/browse/">浏览</a>
        <a href="/gallery">预览</a>
        <a href="/url-download" id="navDownloader">下载器</a>
        <a href="/share">分享</a>
        <a href="/admin" id="navAdmin">管理</a>
        <a href="/me">我的</a>
        <a href="/system" class="active">系统</a>
    </nav>

    <div class="acc-grid">
        <div class="acc-col">
            <section class="panel">
                <h3>本机</h3>
                <div class="info-row"><span class="info-label">主机名</span><span class="info-value" id="rowHost">-</span></div>
                <div class="info-row"><span class="info-label">内核</span><span class="info-value" id="rowKernel">-</span></div>
                <div class="info-row"><span class="info-label">架构 / CPU</span><span class="info-value" id="rowArch">-</span></div>
                <div class="info-row"><span class="info-label">运行时长</span><span class="info-value" id="rowUptime">-</span></div>
                <div class="info-row"><span class="info-label">启动于</span><span class="info-value" id="rowBoot">-</span></div>
                <div class="info-row"><span class="info-label">负载（1 / 5 / 15 分钟）</span><span class="info-value" id="rowLoad">-</span></div>
            </section>

            <section class="panel">
                <h3>CPU</h3>
                <div class="sys-head">
                    <span class="big" id="cpuNow">-</span><span class="unit">%</span>
                    <span class="spacer"></span>
                    <span class="unit" id="cpuPeak">峰值 -</span>
                </div>
                <svg class="sys-chart" id="cpuChart" viewBox="0 0 100 30" preserveAspectRatio="none"></svg>
                <div class="sys-cores" id="cpuCores" style="margin-top:8px"></div>
            </section>

            <section class="panel">
                <h3>内存</h3>
                <div class="sys-head">
                    <span class="big" id="memNow">-</span><span class="unit" id="memTotal">/ -</span>
                    <span class="spacer"></span>
                    <span class="unit" id="memPct">-</span>
                </div>
                <svg class="sys-chart" id="memChart" viewBox="0 0 100 30" preserveAspectRatio="none"></svg>
                <div class="sys-stack" id="memStack"></div>
                <div id="memBreak" style="margin-top:6px"></div>
                <div class="info-row"><span class="info-label">交换分区</span><span class="info-value" id="memSwap">-</span></div>
            </section>

            <section class="panel">
                <h3>温度</h3>
                <div class="sys-head">
                    <span class="big" id="tempNow">-</span><span class="unit">°C</span>
                    <span class="spacer"></span>
                    <span class="unit" id="tempPeak">峰值 -</span>
                </div>
                <svg class="sys-chart" id="tempChart" viewBox="0 0 100 30" preserveAspectRatio="none"></svg>
                <div id="tempList" style="margin-top:6px"></div>
            </section>

            <section class="panel">
                <h3>电池</h3>
                <div class="sys-head">
                    <span class="big" id="batNow">-</span><span class="unit">%</span>
                    <span class="spacer"></span>
                    <span class="unit" id="batStatus">-</span>
                </div>
                <div class="sys-bar" style="height:8px"><i id="batBar" style="width:0"></i></div>
                <div class="info-row" style="margin-top:8px"><span class="info-label">电源</span><span class="info-value" id="batAc">-</span></div>
                <div class="info-row"><span class="info-label">剩余时间</span><span class="info-value" id="batEta">-</span></div>
            </section>
        </div>

        <div class="acc-col">
            <section class="panel">
                <h3>磁盘</h3>
                <div id="diskList"><div class="srow"><span class="srow-path">读取中…</span></div></div>
            </section>

            <section class="panel">
                <h3>无线网络</h3>
                <div class="info-row"><span class="info-label">当前</span><span class="info-value" id="wifiNow">-</span></div>
                <div class="info-row"><span class="info-label">地址</span><span class="info-value" id="wifiIp">-</span></div>
                <div style="margin-top:8px;display:flex;gap:8px;align-items:center">
                    <button class="btn btn-sm" id="wifiScanBtn">扫描</button>
                    <span class="srow-path" id="wifiHint" style="font-size:11px"></span>
                </div>
                <div id="wifiList" style="margin-top:8px"></div>
            </section>

            <section class="panel">
                <h3>服务</h3>
                <div id="svcList"><div class="srow"><span class="srow-path">读取中…</span></div></div>
            </section>
        </div>
    </div>
</div>

<script src="/static/app.js"></script>
<script>
// 页面自己保存最近两分钟的采样（每秒一个点，共 120 点）：曲线只画趋势，
// 不把历史放到服务端 —— 服务端一旦存历史，重启就丢，页面还要处理缺口。
var HISTORY = 120;
var hist = { cpu: [], mem: [], temp: [] };
var lastIo = {};
var histIo = {};   // 每块盘的读写历史（MB/s 合计），只画在展开的详情里

function fmtBytes(n) {
    if (!n) return '0';
    var u = ['B', 'KB', 'MB', 'GB', 'TB'], i = 0;
    while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
    return (n >= 100 ? n.toFixed(0) : n.toFixed(1)) + ' ' + u[i];
}
function fmtUptime(s) {
    var d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
    if (d) return d + ' 天 ' + h + ' 小时';
    if (h) return h + ' 小时 ' + m + ' 分';
    return m + ' 分';
}
function fmtTime(ts) {
    var d = new Date(ts * 1000), p = function (x) { return (x < 10 ? '0' : '') + x; };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}
function level(v, warn, danger) { return v >= danger ? 'danger' : (v >= warn ? 'warn' : ''); }

// 折线：0~100 固定量程，避免曲线在低负载时把噪声放大成"满格"
function drawChart(el, data, cls) {
    var w = 100, h = 30, pad = 3, n = HISTORY;
    if (!data.length) { el.innerHTML = ''; return; }
    var step = w / (n - 1);
    var pts = [];
    for (var i = 0; i < data.length; i++) {
        var x = i * step;
        var v = Math.max(0, Math.min(100, data[i])) / 100;
        var y = (h - pad) - v * (h - 2 * pad);
        pts.push(x.toFixed(2) + ' ' + y.toFixed(2));
    }
    if (pts.length === 1) pts.push(pts[0]);
    var line = 'M' + pts.join(' L');
    var area = line + ' L' + ((data.length - 1) * step).toFixed(2) + ' ' + (h - pad) + ' L0 ' + (h - pad) + ' Z';
    el.innerHTML = '<line class="grid" x1="0" y1="' + (h - pad) + '" x2="' + w + '" y2="' + (h - pad) + '"></line>' +
                   '<path class="area ' + cls + '" d="' + area + '"></path>' +
                   '<path class="line ' + cls + '" d="' + line + '"></path>';
}

// I/O 曲线用动态量程：读写速率没有固定上限，按历史峰值缩放，峰值写在标题上
// I/O 曲线用动态量程：读写速率没有固定上限，按历史峰值缩放。
// 关键在留边距 —— 速率常常是 0，若把 0 映射到 y=h 就正好压在裁切边界上，看起来像没画。
function drawChartMax(el, data, cls) {
    var w = 100, h = 30, pad = 3, n = HISTORY;
    if (!data.length) { el.innerHTML = ''; return 0; }
    var peak = Math.max.apply(null, data);
    if (!(peak > 0)) peak = 1;
    var step = w / (n - 1);
    var pts = [];
    for (var i = 0; i < data.length; i++) {
        var x = i * step;
        var v = Math.max(0, data[i]) / peak;
        var y = (h - pad) - v * (h - 2 * pad);
        pts.push(x.toFixed(2) + ' ' + y.toFixed(2));
    }
    if (pts.length === 1) pts.push(pts[0]);
    var line = 'M' + pts.join(' L');
    var area = line + ' L' + ((data.length - 1) * step).toFixed(2) + ' ' + (h - pad) + ' L0 ' + (h - pad) + ' Z';
    el.innerHTML = '<line class="grid" x1="0" y1="' + (h - pad) + '" x2="' + w + '" y2="' + (h - pad) + '"></line>' +
                   '<path class="area ' + cls + '" d="' + area + '"></path>' +
                   '<path class="line ' + cls + '" d="' + line + '"></path>';
    return peak;
}

function setBar(el, pct) {
    el.style.width = Math.max(0, Math.min(100, pct)) + '%';
    el.className = level(pct, 75, 90);
}

function renderCpu(cpu) {
    var total = cpu.total || 0;
    document.getElementById('cpuNow').textContent = total.toFixed(1);
    hist.cpu.push(total);
    if (hist.cpu.length > HISTORY) hist.cpu.shift();
    var peak = Math.max.apply(null, hist.cpu);
    document.getElementById('cpuPeak').textContent = '峰值 ' + peak.toFixed(0) + '%';
    drawChart(document.getElementById('cpuChart'), hist.cpu, level(total, 75, 90));

    var box = document.getElementById('cpuCores');
    box.innerHTML = '';
    (cpu.cores || []).forEach(function (v, i) {
        var d = document.createElement('div');
        d.className = 'sys-core';
        d.innerHTML = 'CPU' + i + '<span class="val">' + v.toFixed(0) + '%</span>' +
                      '<div class="sys-bar"><i class="' + level(v, 75, 90) + '" style="width:' + v + '%"></i></div>';
        box.appendChild(d);
    });
}

function renderMemory(m) {
    document.getElementById('memNow').textContent = fmtBytes(m.used);
    document.getElementById('memTotal').textContent = '/ ' + fmtBytes(m.total);
    document.getElementById('memPct').textContent = m.percent + '%';

    // 总量拆成四块（进程 / 缓存 / 内核 / 空闲）。只看"已用 1.9 GB"看不出结构 ——
    // 里面近三分之一是内核 slab。每块都给出数值，堆叠条只负责比例。
    var total = m.total || 1;
    var parts = [
        ['进程', m.anon || 0, 'var(--primary)'],
        ['共享内存', m.shmem || 0, 'var(--success)'],
        ['缓存', m.cache || 0, 'var(--warn)'],
        ['内核', m.kernel || 0, 'var(--danger)'],
        ['其他', m.other || 0, 'var(--text-light)'],
        ['空闲', m.free || 0, 'var(--border)']
    ];
    var stack = document.getElementById('memStack');
    var brk = document.getElementById('memBreak');
    stack.innerHTML = '';
    brk.innerHTML = '';
    parts.forEach(function (p) {
        var seg = document.createElement('i');
        seg.style.width = (p[1] / total * 100).toFixed(2) + '%';
        seg.style.background = p[2];
        seg.title = p[0] + ' ' + fmtBytes(p[1]);
        stack.appendChild(seg);
        var row = document.createElement('div');
        row.className = 'info-row';
        row.innerHTML = '<span class="info-label">' + p[0] + '</span><span class="info-value">' +
                        fmtBytes(p[1]) + '（' + (p[1] / total * 100).toFixed(0) + '%）</span>';
        brk.appendChild(row);
    });

    document.getElementById('memSwap').textContent = m.swap_total
        ? fmtBytes(m.swap_used) + ' / ' + fmtBytes(m.swap_total)
        : '未启用';
    hist.mem.push(m.percent || 0);
    if (hist.mem.length > HISTORY) hist.mem.shift();
    drawChart(document.getElementById('memChart'), hist.mem, level(m.percent, 80, 92));
}

function renderTemps(list) {
    var box = document.getElementById('tempList');
    box.innerHTML = '';
    var max = 0;
    (list || []).forEach(function (t) {
        max = Math.max(max, t.celsius);
        var row = document.createElement('div');
        row.className = 'info-row';
        row.innerHTML = '<span class="info-label">' + esc(t.label) + '</span><span class="info-value">' +
                        t.celsius.toFixed(1) + ' °C</span>';
        box.appendChild(row);
    });
    document.getElementById('tempNow').textContent = max ? max.toFixed(1) : '-';
    hist.temp.push(max ? Math.min(100, max) : 0);      // 0~100 映射到 0~100°C，够用
    if (hist.temp.length > HISTORY) hist.temp.shift();
    drawChart(document.getElementById('tempChart'), hist.temp, level(max, 75, 90));
    var peak = Math.max.apply(null, hist.temp);
    document.getElementById('tempPeak').textContent = peak ? '峰值 ' + peak.toFixed(0) + '°C' : '峰值 -';
    if (!list || !list.length) box.innerHTML = '<div class="info-row"><span class="info-label">没有可读的温度传感器</span><span class="info-value">-</span></div>';
}

function renderPower(p) {
    var b = (p && p.battery) || {};
    var panel = document.getElementById('batNow').closest('section');
    if (!b.present) { panel.style.display = 'none'; return; }
    panel.style.display = '';
    document.getElementById('batNow').textContent = b.capacity;
    setBar(document.getElementById('batBar'), b.capacity);

    // 方向以"适配器是否接通"为准，不信 BAT0 的 status：部分机器的 EC 拔掉电源后仍报
    // Charging、充满插着时又报 Not charging，只看 status 会把充放电说反。
    var known = (p.ac_online === true || p.ac_online === false);
    var st;
    if (known) {
        if (!p.ac_online) {
            st = '放电中';
        } else if (b.capacity >= 100 || b.status === 'Full') {
            st = '已充满';
        } else if (b.status === 'Charging') {
            st = '充电中';
        } else {
            st = '已接通，未充电';
        }
    } else {
        st = { Charging: '充电中', Discharging: '放电中', Full: '已充满', 'Not charging': '未充电' }[b.status] || b.status || '-';
    }
    document.getElementById('batStatus').textContent = st;
    document.getElementById('batAc').textContent = known ? (p.ac_online ? '已接通' : '未接通') : '-';

    var eta = '-';
    var watts = b.power_now ? (b.power_now / 1e6) : 0;
    if (known && !p.ac_online && watts > 0 && b.energy_now) {
        eta = fmtUptime(Math.round(b.energy_now / b.power_now * 3600)) + ' 后耗尽（' + watts.toFixed(1) + ' W）';
    } else if (known && p.ac_online && b.capacity >= 100) {
        eta = '已满';
    } else if (watts > 0) {
        eta = watts.toFixed(1) + ' W';
    }
    document.getElementById('batEta').textContent = eta;
}

var SVC_CLASS = { active: 'tag tag-local', failed: 'tag tag-gone', inactive: 'tag', activating: 'tag tag-coded' };
function renderServices(list) {
    var box = document.getElementById('svcList');
    box.innerHTML = '';
    (list || []).forEach(function (s) {
        var row = document.createElement('div');
        row.className = 'srow';
        row.innerHTML = '<span class="srow-name">' + esc(s.name) + '</span>' +
                        '<span class="' + (SVC_CLASS[s.state] || 'tag tag-coded') + '">' + esc(s.state) + '</span>';
        box.appendChild(row);
    });
    if (!list || !list.length) box.innerHTML = '<div class="srow"><span class="srow-path">没有可显示的服务</span></div>';
}

function fmtRate(bps) {
    if (!bps) return '0';
    var u = ['B/s', 'KB/s', 'MB/s', 'GB/s'], i = 0;
    while (bps >= 1024 && i < u.length - 1) { bps /= 1024; i++; }
    return (bps >= 100 ? bps.toFixed(0) : bps.toFixed(1)) + ' ' + u[i];
}

function diskOf(dev) {
    // /dev/sda2 → sda；/dev/nvme0n1p1 → nvme0n1（分区计数要归到整盘）
    var name = (dev || '').replace(/^\/dev\//, '');
    var m = name.match(/^(nvme\d+n\d+|mmcblk\d+)/);
    if (m) return m[1];
    return name.replace(/\d+$/, '');
}

function renderIo(io) {
    lastIo = io || {};
    // 每块盘各存一条历史，曲线画在各自卡片的详情里（常显占地方，也不好看）
    Object.keys(lastIo).forEach(function (k) {
        var v = (lastIo[k].read_bps + lastIo[k].write_bps) / 1048576;
        if (!histIo[k]) histIo[k] = [];
        histIo[k].push(v);
        if (histIo[k].length > HISTORY) histIo[k].shift();
    });
}

// ---------- 无线网络 ----------
// 状态每 5 秒刷一次，列表只在"扫描"时重建 —— 列表里可能有正在输入的密码框，
// 跟着 1 秒的刷新重建会把输入清掉。
var wifiNets = [];

function wifiSecurityLabel(sec) {
    return { open: '开放', wep: 'WEP', wpa: 'WPA', wpa2: 'WPA2', wpa3: 'WPA3' }[sec] || sec || '未知';
}

function loadWifiStatus() {
    fetch('/api/wifi/status', { credentials: 'same-origin' }).then(function (r) {
        if (!r.ok) throw new Error('bad');
        return r.json();
    }).then(function (s) {
        var state = {
            COMPLETED: '已连接', SCANNING: '扫描中', ASSOCIATING: '关联中', ASSOCIATED: '已关联',
            AUTHENTICATING: '认证中', AUTHENTICATED: '已认证', DISCONNECTED: '未连接',
            INACTIVE: '未连接', INTERFACE_DISABLED: '接口关闭'
        }[s.state] || s.state || '-';
        document.getElementById('wifiNow').textContent =
            (s.ssid || '未连接') + ' · ' + state + (s.freq ? ' · ' + s.freq + ' MHz' : '');
        document.getElementById('wifiIp').textContent = s.ip || '-';
    }).catch(function () {
        document.getElementById('wifiNow').textContent = '读取失败';
        document.getElementById('wifiIp').textContent = '-';
    });
}

function renderWifiList() {
    var box = document.getElementById('wifiList');
    box.innerHTML = '';
    if (!wifiNets.length) {
        box.innerHTML = '<div class="srow"><span class="srow-path">没有扫到网络</span></div>';
        return;
    }
    wifiNets.forEach(function (n) {
        var bars = n.signal >= -55 ? '▂▄▆█' : n.signal >= -70 ? '▂▄▆' : n.signal >= -80 ? '▂▄' : '▂';
        var row = document.createElement('div');
        row.className = 'srow';
        row.style.cursor = 'pointer';
        row.innerHTML = '<span class="srow-name">' + esc(n.ssid) + '</span>' +
            '<span class="srow-path">' + esc(wifiSecurityLabel(n.security)) +
            (n.saved ? ' · 已保存' : '') + '</span>' +
            '<span class="srow-path" style="flex:0 0 auto">' + bars + ' ' + n.signal + ' dBm</span>';
        row.addEventListener('click', function () { wifiForm(row, n); });
        box.appendChild(row);
    });
}

function wifiForm(row, net) {
    if (row.querySelector('.wifi-form')) return;
    var form = document.createElement('div');
    form.className = 'wifi-form';
    form.style.cssText = 'display:flex;gap:6px;margin:6px 0 2px;padding-left:20px;align-items:center';
    var locked = net.security !== 'open';
    form.innerHTML = (locked ? '<input class="wifi-input" type="password" placeholder="密码（8~63 位）">' : '') +
        '<button class="btn btn-sm btn-primary">连接</button><button class="btn btn-sm">取消</button>';
    var input = form.querySelector('input');
    var btns = form.querySelectorAll('button');
    btns[0].addEventListener('click', function () {
        btns[0].disabled = true;
        btns[0].textContent = '连接中…';
        fetch('/api/wifi/connect', {
            method: 'POST', credentials: 'same-origin',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ ssid: net.ssid, psk: input ? input.value : '' })
        }).then(function (r) {
            return r.json().then(function (d) { return { ok: r.ok, d: d }; });
        }).then(function (res) {
            if (res.ok) { toast('已连接到 ' + net.ssid, 'success'); form.remove(); }
            else { toast(res.d.error || '连接失败', 'error'); }
            loadWifiStatus();
        }).catch(function () { toast('连接失败', 'error'); })
        .then(function () { btns[0].disabled = false; btns[0].textContent = '连接'; });
    });
    btns[1].addEventListener('click', function () { form.remove(); row.style.cursor = 'pointer'; });
    row.appendChild(form);
    row.style.cursor = 'default';
    if (input) input.focus();
}

function scanWifi() {
    var hint = document.getElementById('wifiHint');
    var btn = document.getElementById('wifiScanBtn');
    btn.disabled = true;
    hint.textContent = '扫描中…（约 4 秒，此时网络负载会短暂升高）';
    fetch('/api/wifi/scan', { credentials: 'same-origin' }).then(function (r) {
        if (!r.ok) throw new Error('bad');
        return r.json();
    }).then(function (d) {
        wifiNets = d.networks || [];
        renderWifiList();
        hint.textContent = wifiNets.length ? ('找到 ' + wifiNets.length + ' 个网络') : '没有扫到网络';
    }).catch(function () {
        hint.textContent = '扫描失败';
        toast('扫描失败', 'error');
    }).then(function () { btn.disabled = false; });
}

function renderDisks(list) {
    var box = document.getElementById('diskList');
    var open = {};
    Array.prototype.forEach.call(box.querySelectorAll('.disk-card.open'), function (c) {
        open[c.dataset.disk] = true;
    });
    box.innerHTML = '';
    if (!list || !list.length) {
        box.innerHTML = '<div class="srow"><span class="srow-path">没有检测到磁盘</span></div>';
        return;
    }
    list.forEach(function (d) {
        var io = lastIo[d.name];
        var card = document.createElement('div');
        card.className = 'disk-card' + (open[d.name] ? ' open' : '');
        card.dataset.disk = d.name;

        var head = document.createElement('div');
        head.className = 'disk-head';
        head.innerHTML =
            '<span class="name">' + esc(d.name) + '</span>' +
            '<span class="meta">' + esc(d.model || '-') + ' · ' + fmtBytes(d.size) +
            (d.rotational ? ' · 机械盘' : ' · 固态') + ' · ' + (d.partitions || []).length + ' 个分区</span>' +
            '<span class="io">' + (io
                ? '繁忙 <b>' + (io.busy || 0).toFixed(0) + '%</b>　读 <b>' + fmtRate(io.read_bps) +
                  '</b>　写 <b>' + fmtRate(io.write_bps) + '</b>'
                : '繁忙 <b>-</b>') + '</span>';
        head.addEventListener('click', function () {
            card.classList.toggle('open');
            if (card.classList.contains('open')) {
                drawChartMax(chart, histIo[d.name] || [], '');
            }
        });
        card.appendChild(head);

        var detail = document.createElement('div');
        detail.className = 'detail';

        // 这块盘自己的读写曲线：只在展开时出现，常显太吵
        // SVGElement 的 className 是只读的（SVGAnimatedString），必须走 setAttribute
        var chart = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        chart.setAttribute('class', 'sys-chart');
        chart.setAttribute('viewBox', '0 0 100 30');
        chart.setAttribute('preserveAspectRatio', 'none');
        var chartBox = document.createElement('div');
        chartBox.className = 'disk-chart-box';
        chartBox.appendChild(chart);
        detail.appendChild(chartBox);

        var kw = document.createElement('div');
        kw.className = 'info-row';
        kw.innerHTML = '<span class="info-label">IOPS</span><span class="info-value">' +
            (io ? io.read_iops.toFixed(0) + ' 读 / ' + io.write_iops.toFixed(0) + ' 写' : '-') +
            '</span>';
        detail.appendChild(kw);

        (d.partitions || []).forEach(function (p) {
            var usage = p.total
                ? fmtBytes(p.used) + ' / ' + fmtBytes(p.total) + '（' + p.percent + '%）'
                : (p.mount ? '容量未知' : (p.fstype ? '未挂载' : '无文件系统'));
            var bar = p.total
                ? '<span class="dl-progress-bar"><span class="fill" style="display:block;height:100%;width:' +
                  Math.min(100, p.percent) + '%;background:' + (p.percent >= 90 ? 'var(--danger)' : 'var(--primary)') +
                  '"></span></span>'
                : '';
            var row = document.createElement('div');
            row.className = 'disk-part';
            row.innerHTML =
                '<span class="pname">' + esc(p.name) + '</span>' +
                '<span class="pmeta">' + esc((p.fstype || '—') + (p.mount ? ' → ' + p.mount : '') +
                (p.readonly ? ' · 只读' : '')) + '</span>' + bar +
                '<span class="puse">' + esc(usage) + '</span>';
            detail.appendChild(row);
        });
        card.appendChild(detail);
        box.appendChild(card);

        // 曲线在元素进 DOM 之后再画：drawChartMax 是直接写 innerHTML
        if (card.classList.contains('open')) {
            drawChartMax(chart, histIo[d.name] || [], '');
        }
    });
}

function loadSystem() {
    fetch('/api/system', { credentials: 'same-origin' }).then(function (r) {
        if (!r.ok) throw new Error('bad');
        return r.json();
    }).then(function (d) {
        var s = d.summary || {}, m = d.metrics || {};
        document.getElementById('rowHost').textContent = s.hostname || '-';
        document.getElementById('rowKernel').textContent = s.kernel || '-';
        document.getElementById('rowArch').textContent = (s.arch || '-') + ' / ' + (s.cpu_count || 0) + ' 核';
        document.getElementById('rowUptime').textContent = s.uptime ? fmtUptime(s.uptime) : '-';
        document.getElementById('rowBoot').textContent = s.boot_at ? fmtTime(s.boot_at) : '-';
        document.getElementById('rowLoad').textContent = [s.load1, s.load5, s.load15].filter(Boolean).join(' / ') || '-';
        renderCpu(m.cpu || {});
        renderMemory(m.memory || {});
        renderTemps(m.temperatures || []);
        renderPower(m.power || {});
        renderIo(m.io);
        renderServices(d.services);
        renderDisks(d.disks);
    }).catch(function (e) {
        // 把真实原因显示出来：只写"读取失败"等于把问题藏起来，排查时只能靠猜
        var why = (e && (e.message || e)) || '未知错误';
        document.getElementById('svcList').innerHTML = '<div class="srow"><span class="srow-path c-danger-strong">读取失败: ' + esc(String(why)) + '</span></div>';
        document.getElementById('diskList').innerHTML = '<div class="srow"><span class="srow-path c-danger-strong">读取失败: ' + esc(String(why)) + '</span></div>';
    });
}

document.getElementById('wifiScanBtn').addEventListener('click', scanWifi);
loadSystem();
loadWifiStatus();
setInterval(function () { if (!document.hidden) loadSystem(); }, 1000);
setInterval(function () { if (!document.hidden) loadWifiStatus(); }, 5000);
</script>
</body>
