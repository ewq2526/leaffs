<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sign In · LeafFS</title>
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png?v=3">
<link rel="icon" type="image/png" sizes="192x192" href="/static/favicon.png?v=3">
<link rel="apple-touch-icon" href="/static/favicon.png?v=3">
<link rel="stylesheet" href="/static/style.css">
<script>window.__LANG__='en';</script>
</head>
<body>

<div class="auth">
    <div class="auth-top">
        <span class="auth-brand"><span class="leaf"><img src="/static/logo.png" alt=""></span>LeafFS</span>
        <!--THEME_TOGGLE-->
    </div>

    <div class="auth-main">
        <div class="auth-card">
            <div class="auth-badge"><span class="dot"></span>Direct over LAN</div>
            <h1 class="auth-h1">Sign in to <span class="mark">LeafFS</span></h1>
            <p class="auth-lead">Sign in to reach this server's files. Every device on the same network can use them.</p>

            <label class="auth-field" for="username">
                <span class="label">Username</span>
                <input class="auth-input" id="username" maxlength="20" placeholder="Enter username" autocomplete="username">
            </label>
            <label class="auth-field" for="password">
                <span class="label">Password</span>
                <input class="auth-input" id="password" type="password" maxlength="50" placeholder="Enter password" autocomplete="current-password">
            </label>

            <div class="auth-actions">
                <button class="auth-btn" id="loginBtn" onclick="doLogin()">Sign In</button>
                <button class="auth-ghost" id="guestBtn" style="display:__GUEST_DISPLAY__" onclick="doGuest()">Continue as Guest</button>
            </div>
            <div class="auth-msg" id="status"></div>
        </div>
    </div>

    <div class="auth-foot">Files never leave your own network</div>
</div>

<script src="/static/app.js"></script>
<script>
var statusBox = document.getElementById('status');

function showStatus(msg, type) {
    statusBox.textContent = msg;
    statusBox.className = 'auth-msg' + (type ? ' ' + type : '');
}

function setBusy(btn, busy, text) {
    btn.disabled = busy;
    btn.textContent = text;
}

function doLogin() {
    var user = document.getElementById('username').value.trim();
    var pass = document.getElementById('password').value.trim();
    var btn = document.getElementById('loginBtn');
    if (!user || !pass) { showStatus('Please enter username and password', 'error'); return; }
    setBusy(btn, true, 'Signing in…');
    showStatus('', '');
    var xhr = new XMLHttpRequest();
    xhr.open('POST', '/api/auth/login', true);
    xhr.setRequestHeader('Content-Type', 'application/json');
    xhr.onload = function () {
        try { var d = JSON.parse(xhr.responseText); } catch (e) { d = {}; }
        if (xhr.status === 200 && d.success) {
            showStatus('Signed in. Redirecting…', 'ok');
            setTimeout(function () { window.location.href = '/browse/'; }, 500);
        } else {
            setBusy(btn, false, 'Sign In');
            showStatus(d.error || 'Sign in failed. Please try again.', 'error');
        }
    };
    xhr.onerror = function () {
        setBusy(btn, false, 'Sign In');
        showStatus('Network error. Please try again later.', 'error');
    };
    xhr.send(JSON.stringify({ username: user, password: pass }));
}

function doGuest() {
    var btn = document.getElementById('guestBtn');
    if (btn.disabled) return;
    setBusy(btn, true, 'Entering…');
    showStatus('', '');
    var xhr = new XMLHttpRequest();
    xhr.open('POST', '/api/guest/login', true);
    xhr.setRequestHeader('Content-Type', 'application/json');
    xhr.onload = function () {
        try { var d = JSON.parse(xhr.responseText); } catch (e) { d = {}; }
        if (xhr.status === 200 && d.success) {
            window.location.href = '/browse/public';
        } else {
            setBusy(btn, false, 'Continue as Guest');
            showStatus(d.error || 'Failed. Please try again.', 'error');
        }
    };
    xhr.onerror = function () {
        setBusy(btn, false, 'Continue as Guest');
        showStatus('Network error. Please try again later.', 'error');
    };
    xhr.send('{}');
}

document.getElementById('username').addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });
document.getElementById('password').addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });
document.getElementById('username').focus();
</script>
</body>
</html>
