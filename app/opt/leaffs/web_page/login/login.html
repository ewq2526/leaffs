<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>登录 · LeafFS</title>
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png?v=3">
<link rel="icon" type="image/png" sizes="192x192" href="/static/favicon.png?v=3">
<link rel="apple-touch-icon" href="/static/favicon.png?v=3">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="auth">
    <div class="auth-top">
        <span class="auth-brand"><span class="leaf"><img src="/static/logo.png" alt=""></span>LeafFS</span>
        <!--THEME_TOGGLE-->
    </div>

    <div class="auth-main">
        <div class="auth-card">
            <div class="auth-badge"><span class="dot"></span>局域网直传</div>
            <h1 class="auth-h1">登录 <span class="mark">LeafFS</span></h1>
            <p class="auth-lead">用账号进入这台服务器的文件空间，同一局域网里的设备都能访问。</p>

            <label class="auth-field" for="username">
                <span class="label">用户名</span>
                <input class="auth-input" id="username" maxlength="20" placeholder="请输入用户名" autocomplete="username">
            </label>
            <label class="auth-field" for="password">
                <span class="label">密码</span>
                <input class="auth-input" id="password" type="password" maxlength="50" placeholder="请输入密码" autocomplete="current-password">
            </label>

            <div class="auth-actions">
                <button class="auth-btn" id="loginBtn" onclick="doLogin()">登录</button>
                <button class="auth-ghost" id="guestBtn" style="display:__GUEST_DISPLAY__" onclick="doGuest()">游客访问</button>
            </div>
            <div class="auth-msg" id="status"></div>
        </div>
    </div>

    <div class="auth-foot">文件只在你和这台机器之间流动</div>
</div>

<script src="/static/app.js"></script>
<script>
var statusBox = document.getElementById('status');

function showStatus(msg, type) {
    statusBox.textContent = msg;
    statusBox.className = 'auth-msg' + (type ? ' ' + type : '');
}

function setBusy(btn, busy, text) {
    btn.disabled = busy;
    btn.textContent = text;
}

function doLogin() {
    var user = document.getElementById('username').value.trim();
    var pass = document.getElementById('password').value.trim();
    var btn = document.getElementById('loginBtn');
    if (!user || !pass) { showStatus('请输入用户名和密码', 'error'); return; }
    setBusy(btn, true, '登录中…');
    showStatus('', '');
    var xhr = new XMLHttpRequest();
    xhr.open('POST', '/api/auth/login', true);
    xhr.setRequestHeader('Content-Type', 'application/json');
    xhr.onload = function () {
        try { var d = JSON.parse(xhr.responseText); } catch (e) { d = {}; }
        if (xhr.status === 200 && d.success) {
            showStatus('登录成功，正在跳转…', 'ok');
            setTimeout(function () { window.location.href = '/browse/'; }, 500);
        } else {
            setBusy(btn, false, '登录');
            showStatus(d.error || '登录失败，请重试', 'error');
        }
    };
    xhr.onerror = function () {
        setBusy(btn, false, '登录');
        showStatus('网络错误，请稍后重试', 'error');
    };
    xhr.send(JSON.stringify({ username: user, password: pass }));
}

function doGuest() {
    var btn = document.getElementById('guestBtn');
    if (btn.disabled) return;
    setBusy(btn, true, '正在进入…');
    showStatus('', '');
    var xhr = new XMLHttpRequest();
    xhr.open('POST', '/api/guest/login', true);
    xhr.setRequestHeader('Content-Type', 'application/json');
    xhr.onload = function () {
        try { var d = JSON.parse(xhr.responseText); } catch (e) { d = {}; }
        if (xhr.status === 200 && d.success) {
            window.location.href = '/browse/public';
        } else {
            setBusy(btn, false, '游客访问');
            showStatus(d.error || '进入失败，请重试', 'error');
        }
    };
    xhr.onerror = function () {
        setBusy(btn, false, '游客访问');
        showStatus('网络错误，请稍后重试', 'error');
    };
    xhr.send('{}');
}

document.getElementById('username').addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });
document.getElementById('password').addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });
document.getElementById('username').focus();
</script>
<script src="/static/arrow.js"></script>
</body>
</html>
