<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark" data-accent="plain">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>分享 - LeafFS</title>
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png?v=3">
<link rel="icon" type="image/png" sizes="192x192" href="/static/favicon.png?v=3">
<link rel="apple-touch-icon" href="/static/favicon.png?v=3">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="logo"><img src="/static/logo.png" alt=""></div>
    <div>
      <div class="t1">LeafFS</div>
      <div class="t2">File Share</div>
    </div>
  </div>
  <div class="who"><b id="whoName">…</b> <span data-i="shared"></span></div>
  <div class="sub" data-i="sub"></div>

  <div class="ld" id="loading" data-i="loading"></div>

  <div class="codebox" id="codeBox" style="display:none">
    <span class="lock">🔒</span>
    <h2 data-i="needCode"></h2>
    <p data-i="codeTip"></p>
    <input class="cin" id="codeInput" type="text" autocomplete="off" maxlength="32" enterkeyhint="go">
    <br>
    <button class="cbtn" id="codeBtn" data-i="confirm"></button>
    <div class="cmsg" id="codeMsg"></div>
  </div>

  <div class="files" id="files"></div>
  <div class="empty" id="emptyBox" style="display:none"><span class="eic">📭</span><span data-i="empty"></span></div>
  <div class="empty" id="errBox" style="display:none"><span class="eic">🔗</span><span data-i="bad"></span></div>

  <div class="foot">LeafFS · <span data-i="foot"></span></div>
</div>

<script>
(function () {
  'use strict';

  var T = {
    zh: { shared: '分享的文件', sub: '无需登录，点开即可下载 · 请只转发给需要的人',
          loading: '加载中…', empty: '暂时没有可下载的内容', bad: '链接无效',
          foot: '让文件简单流动', at: '更新于',
          needCode: '该分享需要访问码', codeTip: '输入分享者提供的访问码后即可查看与下载', confirm: '确认',
          wrong: '访问码不正确', remain: '还可尝试', times: '次', sending: '验证中…',
          lockedIp: '尝试次数过多，本机今日已被限制，请稍后再试或联系分享者',
          lockedAll: '该分享页当前已锁定，请联系分享者解锁',
          lockedItem: '需要访问码 · 点这里输入' },
    en: { shared: 'shared files', sub: 'No login needed — tap to download · only forward to those you trust',
          loading: 'Loading…', empty: 'Nothing available yet', bad: 'Invalid link',
          foot: 'making files easy to move', at: 'updated',
          needCode: 'Access code required', codeTip: 'Enter the access code from the sharer to view and download', confirm: 'Confirm',
          wrong: 'Wrong access code', remain: 'attempts left', times: '', sending: 'Verifying…',
          lockedIp: 'Too many attempts — this device is limited for today, ask the sharer for help',
          lockedAll: 'This share is currently locked, please contact the sharer',
          lockedItem: 'Access code required · tap to enter' }
  };
  var zh = ((navigator.language || 'zh').toLowerCase().indexOf('zh') === 0);
  var I = T[zh ? 'zh' : 'en'];
  document.documentElement.lang = zh ? 'zh-CN' : 'en';
  if (!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
    document.documentElement.setAttribute('data-theme', 'light');
  }
  document.querySelectorAll('[data-i]').forEach(function (el) {
    el.textContent = I[el.getAttribute('data-i')];
  });

  var $ = function (id) { return document.getElementById(id); };
  var m = location.pathname.match(/^\/p\/([^/]+)\/?$/);
  if (!m) { $('loading').style.display = 'none'; $('errBox').style.display = ''; return; }
  var who = decodeURIComponent(m[1]);
  $('whoName').textContent = who;

  function fmtSize(n) {
    if (n < 1024) return n + ' B';
    var u = ['KB', 'MB', 'GB', 'TB'], i = -1;
    do { n /= 1024; i++; } while (n >= 1024 && i < u.length - 1);
    return (n >= 100 ? n.toFixed(0) : n.toFixed(1)) + ' ' + u[i];
  }
  function iconFor(name) {
    var ext = (name.split('.').pop() || '').toLowerCase();
    if (['jpg','jpeg','png','gif','webp','bmp','heic'].indexOf(ext) >= 0) return '🖼️';
    if (['mp4','mov','mkv','avi','webm','3gp','ts','flv','m3u8'].indexOf(ext) >= 0) return '🎬';
    if (['mp3','wav','flac','aac','ogg','m4a'].indexOf(ext) >= 0) return '🎵';
    if (['zip','rar','7z','tar','gz'].indexOf(ext) >= 0) return '🗜️';
    if (['doc','docx','pdf','xls','xlsx','ppt','pptx','txt','md'].indexOf(ext) >= 0) return '📄';
    return '📁';
  }

  function showErr() {
    $('loading').style.display = 'none';
    $('codeBox').style.display = 'none';
    $('errBox').style.display = '';
  }
  function codeMsg(t, cls) {
    var el = $('codeMsg');
    el.textContent = t;
    el.className = 'cmsg ' + (cls || '');
  }

  var pendingLabel = '';     // 正在为哪一条输码（每条分享各有随机标签，互不影响）

  function askCode(label) {
    pendingLabel = label;
    codeMsg('', '');
    var inp = $('codeInput');
    inp.disabled = false; inp.value = '';
    $('codeBox').style.display = '';
    if ($('codeBox').scrollIntoView) $('codeBox').scrollIntoView({ block: 'nearest' });
    inp.focus();
  }

  function submitCode() {
    var inp = $('codeInput');
    var code = inp.value.trim();
    if (!pendingLabel || !code) { codeMsg(I.empty, 'err'); return; }
    var btn = $('codeBtn');
    btn.disabled = true;
    codeMsg(I.sending, '');
    fetch('/api/share/auth', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ label: pendingLabel, code: code })
    }).then(function (r) {
      return r.json().then(function (d) { return { ok: r.ok, d: d }; });
    }).then(function (res) {
      btn.disabled = false;
      var d = res.d || {};
      if (res.ok && d.ok) { location.reload(); return; }
      if (d.error === 'locked') {
        codeMsg(d.reason === 'global' ? I.lockedAll : I.lockedIp, 'err');
        inp.disabled = true;
        return;
      }
      if (d.error === 'incorrect') {
        var left = (typeof d.remaining === 'number') ? d.remaining : 0;
        if (left > 0) codeMsg(I.wrong + '（' + I.remain + ' ' + left + ' ' + I.times + '）', 'err');
        else { codeMsg(I.lockedIp, 'err'); inp.disabled = true; }
        inp.select();
        return;
      }
      codeMsg(I.wrong, 'err');
    }).catch(function () { btn.disabled = false; codeMsg(I.bad, 'err'); });
  }
  $('codeBtn').onclick = submitCode;
  $('codeInput').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') submitCode();
  });

  function rowFor(f) {
    if (f.locked) {
      // 没解锁的那一条：**名字、大小、时间一个都不给** —— 只说明"需要访问码"，
      // 点它就能输码（目标用随机标签指认，标签本身不含任何信息）
      var lrow = document.createElement('div');
      lrow.className = 'frow';
      lrow.style.cursor = 'pointer';
      var lic = document.createElement('div');
      lic.className = 'fic';
      lic.textContent = '🔒';
      var lmid = document.createElement('div');
      lmid.className = 'fmid';
      var lnm = document.createElement('div');
      lnm.className = 'fname';
      lnm.textContent = I.lockedItem;
      lmid.appendChild(lnm);
      lrow.appendChild(lic);
      lrow.appendChild(lmid);
      lrow.onclick = function () { askCode(f.label); };
      return lrow;
    }
    var row = document.createElement('div');
    row.className = 'frow';
    var ic = document.createElement('div');
    ic.className = 'fic';
    ic.textContent = iconFor(f.name);
    var mid = document.createElement('div');
    mid.className = 'fmid';
    var nm = document.createElement('div');
    nm.className = 'fname';
    nm.textContent = f.name;
    var mt = document.createElement('div');
    mt.className = 'fmeta';
    mt.textContent = fmtSize(f.size) + ' · ' + I.at + ' ' + new Date(f.mtime * 1000).toLocaleDateString();
    mid.appendChild(nm);
    mid.appendChild(mt);
    row.appendChild(ic);
    row.appendChild(mid);
    var a = document.createElement('a');
    a.className = 'dbtn';
    a.href = f.url;
    a.textContent = zh ? '下载' : 'Download';
    a.onclick = function (e) { e.stopPropagation(); };
    row.appendChild(a);
    return row;
  }

  function render(d) {
    var files = (d && d.files) || [];
    $('loading').style.display = 'none';
    var box = $('files');
    box.innerHTML = '';
    if (!files.length) {
      var et = $('emptyBox').querySelector('span[data-i]');
      if (et) et.textContent = I.empty;
      $('emptyBox').style.display = '';
      return;
    }
    $('emptyBox').style.display = 'none';
    files.forEach(function (f) { box.appendChild(rowFor(f)); });
  }

  function load() {
    $('emptyBox').style.display = 'none';
    $('files').innerHTML = '';
    $('loading').style.display = '';
    var url = '/p/' + encodeURIComponent(who) + '/api';
    fetch(url).then(function (r) {
      if (r.status === 403) {
        return r.json().then(function () {
          showErr();
          return null;
        });
      }
      if (!r.ok) throw new Error('bad');
      return r.json();
    }).then(function (d) {
      if (d) render(d);
    }).catch(function () { showErr(); });
  }

  load();
})();
</script>
</body>
</html>
