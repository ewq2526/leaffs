<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>分享</title>
<link rel="stylesheet" href="/static/style.css">
<script>window.__WS_PORT__=parseInt('__WS_PORT_NUM__',10)||8081;window.__SERVER_BASE__='__SERVER_BASE_URL__';window.__HAS_LAN__=__HAS_LAN_VAL__;var myRole = __MY_ROLE__ || null;var myUsername = '__MY_USERNAME__' || '';</script>
</head>
<body>
<div class="app">
    <div class="header">
        <h1><span class="ht">分享</span><span class="ws-status"><span class="dot" id="wsDot"></span><span id="wsLabel">连接中...</span></span></h1>
        <div class="info">
            <!--THEME_TOGGLE-->
        </div>
    </div>

    <div class="nav-bar">
        <a href="/browse/">浏览</a>
        <a href="/gallery">预览</a>
        <a href="/url-download" id="navDownloader">下载器</a>
        <a href="/share" class="active">分享</a>
        <a href="/admin" id="navAdmin">管理</a>
        <a href="/me">我的</a>
        <span style="flex:1"></span>
        <button class="nav-back" onclick="window.location.href='/browse/'">返回浏览</button>
    </div>

    <div style="max-width:980px;margin:0 auto;padding:0 16px">
        <div class="admin-grid">
            <div class="admin-card" style="grid-column:1/-1">
                <h3>我的分享</h3>
                <div class="config-group">
                    <label>在「浏览」页勾选文件、点工具栏「分享」，文件会<strong>映射</strong>到公共目录
                        <code style="background:var(--chip-bg,#eef3fd);border-radius:5px;padding:1px 6px">public/shares/<span id="whoami"></span>/</code>：
                        访客无需登录即可在公共区看到并下载；文件本体不搬动，所以<strong>源文件一旦被删除、改名或移动，这条分享立即失效</strong>；发布自公共目录 <code style="background:var(--chip-bg,#eef3fd);border-radius:5px;padding:1px 6px">public/</code> 的文件，别的用户也能删除它。下方可复制直链或移除分享。</label>
                    <div style="margin:10px 0 4px">
                        <a class="btn-admin primary" href="/browse/" style="font-size:12px">去浏览里选文件 →</a>
                        <button class="btn-admin" onclick="loadList()" style="font-size:12px">刷新</button>
                    </div>
                    <div style="display:flex;align-items:center;gap:8px;margin:6px 0 2px;flex-wrap:wrap">
                        <span style="font-size:12px;color:var(--text-light,#8a97bd)">访客分享页：</span>
                        <input readonly id="visitorUrl" style="flex:1;min-width:170px;font-size:12px;padding:6px 9px;border:1px solid var(--border,#dbe4f5);border-radius:8px;background:var(--bg,#f4f7fd);color:var(--text)">
                        <button class="btn-admin" onclick="copyVisitor()" style="font-size:11px">复制访客页</button>
                        <span id="visitorLanWarn" style="display:none;font-size:11px;color:#b03a50">无可用局域网，此地址只有本机能打开</span>
                    </div>
                    <div style="border-top:1px solid var(--border,#eef1f8);margin-top:12px;padding-top:12px">
                        <div style="font-size:13px;font-weight:650;color:var(--text);margin-bottom:6px">访问码保护 <span id="codeState" style="font-weight:500;font-size:11.5px;color:var(--text-light,#8a97bd)"></span></div>
                        <div style="font-size:11px;color:var(--text-light,#a3aed0)">访问码是<b>每条分享各自一条</b> —— 在下面每条右侧点「设码 / 查看码」。访客输码后浏览器记住 1 小时；输错会触发防爆破（见下方提醒）。</div>
                    </div>
                    <div id="attackTip" style="display:none;margin-top:10px;padding:9px 12px;border-radius:10px;background:rgba(208,86,107,.10);border:1px solid rgba(208,86,107,.35);font-size:12px;color:#b03a50;line-height:1.7"></div>
                    <div id="mountBox" style="display:none;margin:12px 0">
                        <div style="font-size:13px;font-weight:650;color:var(--text);margin-bottom:6px">挂载本机路径 <span style="font-weight:500;font-size:11.5px;color:var(--text-light,#8a97bd)">只读</span></div>
                        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
                            <input id="mountPath" type="text" autocomplete="off" placeholder="本机绝对路径，例如 E:\电影 或 D:\资料\a.pdf"
                                   style="flex:1;min-width:220px;font-size:12px;padding:7px 10px;border:1px solid var(--border,#dbe4f5);border-radius:8px;background:var(--bg,#f4f7fd);color:var(--text)">
                            <button class="btn-admin" onclick="pickMount(false)" style="font-size:11px">选目录…</button>
                            <button class="btn-admin" onclick="pickMount(true)" style="font-size:11px">选文件…</button>
                            <button class="btn-admin primary" onclick="doMount()" style="font-size:11px">挂载</button>
                        </div>
                        <div style="font-size:11px;color:var(--text-light,#a3aed0);margin-top:5px">目录或单个文件都行，<b>不复制文件</b>；挂上来的内容<b>只读</b>。挂载点出现在 <code>public/mounts/</code> 下（就在公共目录里，不按用户分），名字就是它在本机上的名字 —— 只有服务端本机（桌面窗口或手机 App）能做这件事。</div>
                    </div>
                    <div id="shareList"></div>
                    <div id="emptyTip" style="display:none;font-size:12px;color:var(--text-light);padding:18px 0;text-align:center">暂无分享 —— 去「浏览」勾选文件后点工具栏「分享」</div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="/static/app.js"></script>
<script>
var who = myUsername || '';
document.getElementById('whoami').textContent = who || '(我)';
// 环境判断：桌面内嵌窗口有 pywebview 桥；安卓 App 的 GeckoView 用 leaffs:// 把请求交给原生。
// 两者都不是（普通浏览器远程访问）时挂载入口根本不会出现 —— 服务端不给 can_mount。
var isAndroidApp = /Android/i.test(navigator.userAgent);
if (isAndroidApp) {
    var mountInput = document.getElementById('mountPath');
    if (mountInput) mountInput.placeholder = '手机上的绝对路径，例如 /storage/emulated/0/DCIM';
}
(function () {
    var navDownloader = document.getElementById('navDownloader');
    var navAdmin = document.getElementById('navAdmin');
    if (navDownloader) navDownloader.style.display = (myRole === 'guest' || !myRole) ? 'none' : '';
    if (navAdmin) navAdmin.style.display = (myRole === 'admin' || myRole === 'super_admin') ? '' : 'none';
})();
var visitorPath = '/p/' + (who || '');
if (visitorPath === '/p/') { visitorPath = '/share'; }
// 对外基址由服务端注入：桌面窗口是 localhost、安卓 WebView 是 127.0.0.1，
// 用 location.origin 拼出来的链接别人打不开
var visitorBase = window.__SERVER_BASE__ || location.origin;
var visitorUrlInput = document.getElementById('visitorUrl');
if (visitorUrlInput) visitorUrlInput.value = visitorBase + visitorPath;
if (window.__HAS_LAN__ === false) {
    var _lanWarn = document.getElementById('visitorLanWarn');
    if (_lanWarn) _lanWarn.style.display = '';
}
function copyVisitor() {
    if (!visitorUrlInput) return;
    var ta = document.createElement('textarea');
    ta.value = visitorUrlInput.value;
    ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
    batchToast('访客页地址已复制', 'success');
}

// ---------- 访问码 + 防爆破 ----------
function fmtTs(ts) {
    if (!ts) return '';
    try {
        var d = new Date(ts * 1000);
        function p(n) { return (n < 10 ? '0' : '') + n; }
        return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
    } catch (e) { return ''; }
}
function loadShareStatus() {
    fetch('/api/share/status').then(function (r) { return r.json(); }).then(function (st) {
        var codeState = document.getElementById('codeState');
        if (codeState) {
            // 码是每条一条，所以这里报"几条设了码"，而不是一个开关
            var n = (st && st.coded_count) || 0;
            codeState.textContent = n ? ('（' + n + ' 条已设码）') : '（都还没设码）';
        }
        renderAttackTip(st);
    }).catch(function () {});
}

// 每条分享各一个码：点「设码 / 查看码」——先把当前码读回来预填（自己的码本来就该看得见），
// 留空保存 = 关闭这一条的码。
function editCode(path, btn) {
    if (btn) btn.disabled = true;
    fetch('/api/share/code?path=' + encodeURIComponent(path))
        .then(function (r) { return r.json(); })
        .then(function (d) {
            if (btn) btn.disabled = false;
            if (!d || d.error) { batchToast((d && d.error) || '读取失败', 'error'); return; }
            var cur = d.legacy ? '' : (d.code || '');
            var tip = d.legacy
                ? '这条的码是旧格式保存的（读不回明文）。输入一个新码即可覆盖（留空=关闭）：'
                : '这一条的访问码（留空=关闭，6~32 位）：';
            var v = prompt(tip, cur);
            if (v === null) return;
            applyCode(path, v.trim(), btn);
        })
        .catch(function () { if (btn) btn.disabled = false; batchToast('读取失败', 'error'); });
}

function applyCode(path, code, btn) {
    if (code && (code.length < 6 || code.length > 32)) { batchToast('长度需 6~32 位', 'error'); return; }
    if (btn) btn.disabled = true;
    fetch('/api/share/code', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ path: path, code: code })
    }).then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (res) {
          if (btn) btn.disabled = false;
          if (!res.ok) { batchToast((res.d && res.d.error) || '保存失败', 'error'); return; }
          batchToast(code ? '这一条已设码' : '已关闭这一条的访问码', 'success');
          loadShareStatus();
          loadList();
      }).catch(function () { if (btn) btn.disabled = false; batchToast('保存失败', 'error'); });
}
function resetAttempts() {
    if (!confirm('重置今日防爆破计数并解除锁定？')) return;
    fetch('/api/share/reset', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}'
    }).then(function (r) { return r.json(); }).then(function (d) {
        batchToast(d && d.success ? '已重置' : '重置失败', d && d.success ? 'success' : 'error');
        loadShareStatus();
    }).catch(function () { batchToast('重置失败', 'error'); });
}
function renderAttackTip(st) {
    var tip = document.getElementById('attackTip');
    if (!tip) return;
    if (!st || (!st.global_active && !st.ip_locked && !st.failed_today)) { tip.style.display = 'none'; return; }
    var parts = [];
    if (st.global_active) parts.push('⚠️ 疑似遭大量暴力尝试，你的分享页已临时全局锁定（至 ' + fmtTs(st.global_locked_until) + '）');
    if (st.ip_locked) parts.push('已锁定 ' + st.ip_locked + ' 个异常 IP');
    if (st.failed_today) parts.push('今日共 ' + st.failed_today + ' 次输错');
    var html = parts.join(' · ') + '　<a href="javascript:void(0)" onclick="resetAttempts()" style="color:#b03a50;font-weight:700">立即重置</a>';
    tip.innerHTML = html;
    tip.style.display = '';
}
loadShareStatus();

function fmtTs(ts) {
    try {
        var d = new Date(ts * 1000);
        function p(n) { return (n < 10 ? '0' : '') + n; }
        return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
    } catch (e) { return ''; }
}
function copyText(t) {
    var ta = document.createElement('textarea');
    ta.value = t; ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
    batchToast('链接已复制', 'success');
}
function removeMap(path, btn) {
    if (!confirm('移除这个分享？公共目录中将不再显示该文件。')) return;
    fetch('/api/share/unpublish', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ path: path })
    }).then(function (r) { return r.json(); }).then(function (d) {
        if (d && d.success) {
            batchToast('已移除', 'success');
            var row = btn.closest('.srow'); if (row) row.remove();
            var left = document.querySelectorAll('#shareList .srow').length;
            document.getElementById('emptyTip').style.display = left ? 'none' : 'block';
        } else { batchToast((d && d.error) || '移除失败', 'error'); }
    }).catch(function () { batchToast('移除失败', 'error'); });
}

function doMount() {
    var el = document.getElementById('mountPath');
    var p = (el.value || '').trim();
    if (!p) { batchToast('请填本机绝对路径', 'error'); return; }
    fetch('/api/share/mount', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({path: p})
    }).then(function (r) {
        return r.json().then(function (d) { return {ok: r.ok, d: d}; });
    }).then(function (res) {
        if (!res.ok) { batchToast((res.d && res.d.error) || '挂载失败', 'error'); return; }
        el.value = '';
        batchToast('已挂载到 public/mounts/', 'success');
        loadList();
    }).catch(function () { batchToast('挂载失败', 'error'); });
}

// 选路径一律走**系统**的选择框：桌面内嵌窗口用 pywebview 的原生对话框，安卓 App
// 用系统的目录/文件选择器（经 leaffs:// 交给原生，选完由原生把路径填回来）。
// 服务端不再自己爬目录 —— 系统对话框能进任何位置，也不用在网页里一层层点。
function pickMount(isFile) {
    if (window.pywebview && window.pywebview.api && window.pywebview.api.pick_mount_path) {
        window.pywebview.api.pick_mount_path(!!isFile).then(function (p) {
            if (p) usePick(p);
        });
        return;
    }
    if (isAndroidApp) {
        // 用户名一起带过去：服务端登记挂载要记属主，网页这边才知道自己是谁
        location.href = 'leaffs://mountpick/' + (isFile ? 'file' : 'dir') +
            '?u=' + encodeURIComponent(who);
        return;
    }
    batchToast('这个环境没有系统选择框，请手动填路径', 'error');
}

function usePick(p) {
    document.getElementById('mountPath').value = p;
    batchToast('已填入路径，点「挂载」即可', 'success');
}

function rowMeta(it) {
    var parts = [];
    if (it.created) parts.push(fmtTs(it.created));
    if (it.by && it.by !== who) parts.push(it.by);
    return parts.join(' · ');
}

function loadList() {
    var box = document.getElementById('shareList');
    var emptyTip = document.getElementById('emptyTip');
    fetch('/api/share').then(function (r) {
        if (!r.ok) throw new Error('bad');
        return r.json();
    }).then(function (d) {
        var items = (d && d.mappings) || [];
        var mountBox = document.getElementById('mountBox');
        // 入口只在"服务端本机令牌会话"里出现；服务端同样会判定，不靠这里藏按钮
        if (mountBox) mountBox.style.display = (d && d.can_mount) ? 'block' : 'none';
        box.innerHTML = '';
        emptyTip.style.display = items.length ? 'none' : 'block';
        items.forEach(function (it) {
            var full = visitorBase + it.url;
            var row = document.createElement('div');
            row.className = 'srow';
            row.style.cssText = 'display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--border,#eef1f8);font-size:13px;flex-wrap:wrap';
            var nm = document.createElement('span');
            nm.style.cssText = 'font-weight:600;color:var(--text);flex:1 1 140px;min-width:0;word-break:break-all';
            nm.textContent = it.name;
            var st = document.createElement('span');
            // 路径没有空格，必须能断词 —— 否则这一列会直接溢出卡片（min-width 压过了 flex 的自动最小宽度）
            st.style.cssText = 'font-size:11.5px;color:var(--text-light,#8a97bd);flex:1;min-width:180px;word-break:break-all';
            var meta = rowMeta(it);
            st.textContent = meta ? (meta + ' · ' + it.src) : it.src;
            if (!it.exists) {
                var gone = document.createElement('span');
                gone.style.cssText = 'font-size:11px;color:#b3542e;background:rgba(200,110,60,.12);border-radius:999px;padding:1px 8px';
                gone.textContent = '源文件已不存在';
                row.appendChild(gone);
            }
            if (it.local && it.exists) {
                var loc = document.createElement('span');
                loc.style.cssText = 'font-size:11px;color:#2f6b4f;background:rgba(60,150,110,.12);border-radius:999px;padding:1px 8px';
                loc.textContent = '本机路径';
                row.appendChild(loc);
            }
            if (it.coded) {
                var lk = document.createElement('span');
                lk.style.cssText = 'font-size:11px;color:#7a5b2f;background:rgba(200,150,60,.14);border-radius:999px;padding:1px 8px';
                lk.textContent = '已设码';
                row.appendChild(lk);
            }
            var cd = document.createElement('button');
            cd.className = 'btn-admin'; cd.style.cssText = 'font-size:11px';
            cd.textContent = it.coded ? '查看/改码' : '设码';
            cd.onclick = function () { editCode(it.path, cd); };
            var cp = document.createElement('button');
            cp.className = 'btn-admin'; cp.style.cssText = 'font-size:11px';
            if (it.type === 'folder') {
                // 目录映射没有"下载"这回事，给的是浏览入口
                cp.textContent = '打开';
                cp.onclick = function () { window.open(it.url, '_blank'); };
            } else {
                cp.textContent = '复制链接';
                cp.onclick = function () { copyText(full); };
            }
            var rm = document.createElement('button');
            rm.className = 'btn-admin danger'; rm.style.cssText = 'font-size:11px';
            rm.textContent = '移除';
            rm.onclick = function () { removeMap(it.path, rm); };
            row.appendChild(nm); row.appendChild(st);
            row.appendChild(cp); row.appendChild(cd); row.appendChild(rm);
            box.appendChild(row);
        });
    }).catch(function () {
        box.innerHTML = '<div style="font-size:12.5px;color:var(--danger,#c0556a);padding:12px 0">加载失败，请确认已登录</div>';
    });
}
loadList();
connectWS();
</script>
</body>
</html>
