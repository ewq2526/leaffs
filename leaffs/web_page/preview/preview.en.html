<!-- English page. AI-translated. -->
<!-- Translated per TRANSLATION_GLOSSARY.md; in-page category header rendered as "Category view". -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Gallery</title>
<link rel="stylesheet" href="/static/style.css">
<script>window.__WS_PORT__=parseInt('__WS_PORT_NUM__',10)||8081;</script>
<script>window.__LANG__='en';</script></head>
<body>
<div class="app">
    <div class="header">
        <h1><span class="ht">Gallery</span><span class="ws-status"><span class="dot" id="wsDot"></span><span id="wsLabel">Connecting...</span></span></h1>
        <div class="info">
            <!--THEME_TOGGLE-->
        </div>
    </div>

    <div class="nav-bar">
        <a href="/browse/">Browse</a>
        <a href="/gallery" class="active">Gallery</a>
        <a href="/url-download">Downloader</a>
        <a href="/share">Share</a>
        <a href="/admin">Admin</a>
        <a href="/me">My Account</a>
        <span style="flex:1"></span>
    </div>

    <div class="gallery-header">
        Category view
    </div>
    <div class="breadcrumb" id="galleryBreadcrumb"><a href="/browse/">Home</a></div>

    <div class="gallery-tabs" id="galleryTabs">
        <div class="gallery-tab active" data-type="all" onclick="switchTab('all')">All</div>
        <div class="gallery-tab" data-type="image" onclick="switchTab('image')">Images</div>
        <div class="gallery-tab" data-type="video" onclick="switchTab('video')">Videos</div>
        <div class="gallery-tab" data-type="audio" onclick="switchTab('audio')">Audio</div>
        <div class="gallery-tab" data-type="text" onclick="switchTab('text')">Text</div>
        <div class="gallery-tab" data-type="pdf" onclick="switchTab('pdf')">PDF</div>
        <div class="gallery-tab" data-type="other" onclick="switchTab('other')">Other</div>
    </div>

    <div class="gallery-search">
        <input class="gallery-search-input" id="gallerySearch" placeholder="Search all files..." oninput="debounceGallerySearch()">
    </div>

    <div class="gallery-grid" id="galleryGrid">
        <div class="empty"><p>Loading...</p></div>
    </div>
    <div style="display:none" id="totalCount"></div>
</div>

<script src="/static/app.js"></script>
<script src="/static/preview/preview.js"></script>
<script>
var myRole = __MY_ROLE__;
// 根据角色显隐导航项
(function(){
    var isGuest = myRole === 'guest' || !myRole;
    var navDownloader = document.querySelector('.nav-bar a[href="/url-download"]');
    var navAdmin = document.querySelector('.nav-bar a[href="/admin"]');
    var navShare = document.querySelector('.nav-bar a[href="/share"]');
    if (navDownloader) navDownloader.style.display = isGuest ? 'none' : '';
    if (navAdmin) navAdmin.style.display = (myRole === 'admin' || myRole === 'super_admin') ? '' : 'none';
    if (navShare) navShare.style.display = isGuest ? 'none' : '';
})();

var allFiles = [];
var currentTab = 'all';
var _currentUsername = '';
var _isGuest = false;
var _currentScanRoot = '';
var _loadGen = 0;

function onWSConnected() { sendWS({ type: 'gallery-sub' }); loadAllFiles(); }

// Server pushes "the file tree changed" → rescan once. It is only a signal, never a list
// (the page pulls the list itself, under its own permissions); a batch operation sends
// several of these, so they are debounced into a single rescan.
var _galleryRefreshTimer = null;
function handleWSMessage(msg) {
    if (msg.type !== 'gallery') return;
    if (_galleryRefreshTimer) clearTimeout(_galleryRefreshTimer);
    _galleryRefreshTimer = setTimeout(function () {
        _galleryRefreshTimer = null;
        loadAllFiles();
    }, 400);
}

function getUserInfo(callback) {
    fetch('/api/auth/check')
        .then(function(r) { return r.json(); })
        .then(function(data) {
            _currentUsername = data.username || '';
            _isGuest = (_currentUsername === '游客' || !_currentUsername);
            callback();
        })
        .catch(function() {
            _currentUsername = '';
            _isGuest = true;
            callback();
        });
}

function updateGalleryBreadcrumb() {
    var el = document.getElementById('galleryBreadcrumb');
    var isInPublic = _currentScanRoot === 'public';
    var locationLabel = isInPublic ? 'Public' : 'My folder';
    var html = '<span style="font-size:12px;font-weight:600;color:var(--text);margin-right:8px;padding:2px 8px;border-radius:4px;background:var(--bg);border:1px solid var(--border)">' + locationLabel + '</span>';
    if (isInPublic) {
        html += '<a href="/gallery?dir=public">Public</a>';
        // 游客只在公共目录，不提供“切换到我的目录”
        if (myRole !== 'guest') {
            html += ' <span style="margin-left:14px;color:var(--text-light);font-size:11px">|</span> ';
            html += '<a href="/gallery" style="color:var(--primary);font-weight:500;font-size:12px">Switch to My folder</a>';
        }
    } else {
        var parts = _currentScanRoot.split('/');
        var userName = parts[1] || '';
        html += '<span>' + esc(userName) + '</span>';
        html += ' <span style="margin-left:14px;color:var(--text-light);font-size:11px">|</span> ';
        html += '<a href="/gallery?dir=public" style="color:var(--primary);font-weight:500;font-size:12px">Switch to Public</a>';
    }
    el.innerHTML = html;
}

var _loadingQueue = [];

function loadAllFiles() {
    _loadGen++;
    var myGen = _loadGen;
    getUserInfo(function() {
        var urlParams = new URLSearchParams(window.location.search);
        var dirParam = urlParams.get('dir');
        if (dirParam) {
            _currentScanRoot = dirParam;
        } else if (!_currentScanRoot) {
            if (_isGuest) {
                _currentScanRoot = 'public';
            } else if (_currentUsername) {
                _currentScanRoot = 'users/' + _currentUsername;
            } else {
                _currentScanRoot = '';
            }
        }
        updateGalleryBreadcrumb();
        _loadingQueue = [];
        allFiles = [];
        if (_currentScanRoot) {
            fetchQueue(_currentScanRoot, myGen);
        } else {
            fetchQueue('', myGen);
        }
    });
}

function fetchQueue(path, gen) {
    fetch('/api/files?path=' + encodeURIComponent(path))
        .then(function (r) { return r.json(); })
        .then(function (d) {
            if (gen !== _loadGen) return;
            var items = d.files || [];
            items.forEach(function (f) {
                if (f.type === 'folder') {
                    _loadingQueue.push(f.path);
                } else {
                    allFiles.push(f);
                }
            });
            processQueue(gen);
        })
        .catch(function () {
            if (gen !== _loadGen) return;
            document.getElementById('galleryGrid').innerHTML = '<div class="empty"><p>Failed to load</p></div>';
        });
}

function processQueue(gen) {
    if (gen !== _loadGen) return;
    if (!_loadingQueue.length) {
        renderGallery();
        return;
    }
    var folderPath = _loadingQueue.shift();
    fetch('/api/files?path=' + encodeURIComponent(folderPath))
        .then(function (r) { return r.json(); })
        .then(function (d) {
            if (gen !== _loadGen) return;
            var items = d.files || [];
            items.forEach(function (f) {
                if (f.type === 'folder') {
                    _loadingQueue.push(f.path);
                } else {
                    allFiles.push(f);
                }
            });
            setTimeout(function() { processQueue(gen); }, 10);
        });
}

function switchTab(type) {
    currentTab = type;
    document.querySelectorAll('.gallery-tab').forEach(function (tab) {
        tab.classList.toggle('active', tab.dataset.type === type);
    });
    renderGallery();
}

// Give up for good: just drop the image — the placeholder icon sits underneath it
function thumbGiveUpIcon(img) {
    if (img && img.parentNode) img.parentNode.removeChild(img);
}

function thumbError(img) {
    var retries = parseInt(img.getAttribute('data-retry') || '0', 10);
    if (retries < 1) {
        // First failure: retry once silently after 5s with a cache-busting stamp (keeping the
        // full query string). The image stays transparent meanwhile, so the user keeps seeing
        // the placeholder icon — never a "loading" or "failed" state.
        img.setAttribute('data-retry', '1');
        if (!img.getAttribute('data-src')) img.setAttribute('data-src', img.getAttribute('src') || '');
        setTimeout(function () {
            if (!img.isConnected) return;
            var base = img.getAttribute('data-src') || img.getAttribute('src') || '';
            if (!base) { thumbGiveUpIcon(img); return; }
            img.src = base + (base.indexOf('?') === -1 ? '?' : '&') + '_=' + Date.now();
        }, 5000);
        return;
    }
    // Still failing: stay on the placeholder icon
    thumbGiveUpIcon(img);
}

var _gallerySearchTimer = null;
var gallerySearchQuery = '';

function debounceGallerySearch() {
    if (_gallerySearchTimer) clearTimeout(_gallerySearchTimer);
    _gallerySearchTimer = setTimeout(function () {
        _gallerySearchTimer = null;
        gallerySearchQuery = document.getElementById('gallerySearch').value.toLowerCase().trim();
        renderGallery();
    }, 200);
}

function renderGallery() {
    var container = document.getElementById('galleryGrid');
    var filtered = allFiles.filter(function (f) {
        if (f.type === 'folder') return false;
        if (currentTab === 'all') return true;
        return fileType(f.name) === currentTab;
    });
    if (gallerySearchQuery) {
        filtered = filtered.filter(function (f) {
            return f.name.toLowerCase().includes(gallerySearchQuery);
        });
    }

    if (!filtered.length) {
        container.innerHTML = '<div class="empty"><p>' + (gallerySearchQuery ? 'No matches' : 'No files yet') + '</p></div>';
        document.getElementById('totalCount').textContent = '0 files';
        return;
    }

    document.getElementById('totalCount').textContent = filtered.length + ' files';

    var html = '';
    for (var i = 0; i < filtered.length; i++) {
        var f = filtered[i];
        var encodedPath = encodeURIComponent(f.path);
        var sname = jsAttr(f.path);   // only used in onclick="openPreview('...')" ⇒ both escapes
        var ename = esc(f.name);
        // Attributes carry the HTML-escaped path; getAttribute() reads the raw value back,
        // which is exactly the key _thumbOk uses
        var eh = escAttr(f.path);   // only used in data-path="..." ⇒ quotes must be escaped
        var ft = fileType(f.name);
        var iconFallback = ft === 'video' ? '&#127916;' : '&#128444;';

        var thumbHtml = '';
        if (ft === 'image' || ft === 'video') {
            // The card is one unit: neither the placeholder icon nor the image gets its own
            // click handler — the outer .gallery-item takes care of it
            thumbHtml = '<span class="thumb-wrap"><span class="icon-large">' + iconFallback + '</span><img class="thumb' + (_thumbOk[f.path] ? ' loaded' : '') + '" src="/api/thumb?path=' + encodedPath +
                '" alt="" loading="lazy" data-retry="0" data-path="' + eh + '" ' +
                'onload="thumbLoaded(this)" ' +
                'onerror="thumbError(this)"></span>';
        } else {
            var icon = getFileIcon(f.name);
            thumbHtml = '<span class="icon-large">' + icon + '</span>';
        }

        html += '<div class="gallery-item" onclick="openPreview(\'' + sname + '\', allFiles)">';
        html += thumbHtml;
        html += '<div class="item-name" title="' + escAttr(f.name) + '">' + ename + '</div>';
        html += '<div style="font-size:11px;color:var(--muted)">' + formatSize(f.size) + '</div>';
        html += '</div>';
    }
    container.innerHTML = html;
}

var urlParams = new URLSearchParams(window.location.search);
var initType = urlParams.get('type');
if (initType) {
    currentTab = initType;
    document.querySelectorAll('.gallery-tab').forEach(function (tab) {
        tab.classList.toggle('active', tab.dataset.type === initType);
    });
}

loadAllFiles();
connectWS();
</script>
<style>
.gallery-header { font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 10px; }
.breadcrumb { font-size: 12px; margin-bottom: 10px; display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.breadcrumb a { color: var(--primary); text-decoration: none; font-size: 12px; }
.breadcrumb a:hover { text-decoration: underline; }
.breadcrumb span { color: var(--text); }
.gallery-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.gallery-tab { padding: 4px 14px; border-radius: 20px; border: 1px solid var(--border); font-size: 12px; cursor: pointer; color: var(--text); background: var(--card-bg); }
.gallery-tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.gallery-search { margin-bottom: 12px; }
.gallery-search-input { width: 100%; padding: 8px 12px; border: 2px solid var(--border); border-radius: 8px; font-size: 13px; outline: none; background: var(--card-bg); color: var(--text); }
.gallery-search-input:focus { border-color: var(--primary); }
.gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.gallery-item { background-color: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; cursor: pointer; text-align: center; padding-bottom: 8px; }
.gallery-item:hover { border-color: var(--primary); }
.gallery-item img.thumb { width: 100%; height: 120px; object-fit: cover; display: block; }
.gallery-item .icon-large { font-size: 40px; display: flex; align-items: center; justify-content: center; height: 120px; }
.gallery-item .item-name { font-size: 12px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 6px 8px 2px; }
.gallery-empty { text-align: center; padding: 80px 20px; color: var(--text-light); font-size: 13px; }
.empty { text-align: center; padding: 60px 20px; color: var(--text-light); font-size: 13px; }
</style>
</body>
</html>
