<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>我的</title>
<link rel="stylesheet" href="/static/style.css">
<script>window.__WS_PORT__=parseInt('__WS_PORT_NUM__',10)||8081;</script>
<style>
.acc-card { max-width: 560px; margin: 26px auto 40px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 28px; }
.acc-avatar { width: 64px; height: 64px; border-radius: 50%; background: linear-gradient(135deg,#0ea5e9,#38bdf8); color:#fff; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 700; margin: 0 auto 10px; }
.acc-name { text-align: center; font-size: 17px; font-weight: 700; color: var(--text); }
.acc-role { text-align: center; font-size: 12px; color: var(--primary); margin: 4px 0 14px; }
.acc-row { display: flex; justify-content: space-between; align-items: center; padding: 11px 2px; border-bottom: 1px dashed var(--border); font-size: 14px; }
.acc-row:last-of-type { border-bottom: none; }
.acc-row .k { color: var(--text-light); }
.acc-row .v { color: var(--text); font-weight: 600; word-break: break-all; text-align: right; }
.acc-warn { display: none; margin: 14px 0 4px; padding: 9px 12px; border-radius: 10px; font-size: 12px; line-height: 1.6; color:#8a6a00; background: rgba(234,179,8,.14); border: 1px solid rgba(234,179,8,.55); }
.acc-warn a { color: #0ea5e9; font-weight: 600; text-decoration: none; }
.danger-zone { margin-top: 24px; text-align: center; }
.danger-zone .btn-danger { min-width: 160px; justify-content: center; }
.acc-hint { font-size: 12px; color: var(--text-light); text-align: center; margin-top: 10px; line-height: 1.6; }
</style>
</head>
<body>
<div class="app">
    <div class="header">
        <h1><span class="ht">我的</span></h1>
        <div class="info">
            <button class="dark-toggle" id="darkToggle" onclick="toggleDark()" style="width:auto;gap:4px;padding:0 10px"><span id="darkIcon">&#9788;</span><span id="darkLabel" style="font-size:11px;font-weight:500">亮色</span></button>
        </div>
    </div>

    <div class="nav-bar">
        <a href="/browse/">浏览</a>
        <a href="/gallery">预览</a>
        <a href="/url-download" id="accNavDownloader">下载器</a>
        <a href="/admin" id="accNavAdmin">管理</a>
        <a href="/me" class="active">我的</a>
        <span style="flex:1"></span>
    </div>

    <div class="acc-card">
        <div class="acc-avatar" id="accAvatar">?</div>
        <div class="acc-name" id="accName">-</div>
        <div class="acc-role" id="accRole">-</div>

        <div class="acc-row"><span class="k">登录用户</span><span class="v" id="rowUser">-</span></div>
        <div class="acc-row"><span class="k">角色</span><span class="v" id="rowRole">-</span></div>
        <div class="acc-row"><span class="k">游客模式</span><span class="v" id="rowGuest">-</span></div>
        <div class="acc-row"><span class="k">服务器地址</span><span class="v" id="rowServer">-</span></div>
        <div class="acc-row">
            <span class="k">界面语言</span>
            <span class="v" style="display:flex;align-items:center;gap:8px">
                <select id="langSel" onchange="onLangChange()" style="padding:4px 8px;border:1px solid var(--border);border-radius:6px;font-size:13px;background:var(--card-bg);color:var(--text)">
                    <option value="zh">中文</option>
                    <option value="en">English</option>
                </select>
            </span>
        </div>
        <div class="acc-hint">英文界面由 AI 翻译，可能与中文存在差异。English UI is AI-translated and may differ from Chinese.</div>

        <div class="acc-warn" id="accWarn">当前仍在使用<strong>默认密码</strong>（admin / admin），请尽快修改：<a href="/admin/users">去改密码 →</a></div>

        <div class="danger-zone">
            <button class="btn btn-danger" id="logoutBtn">退出登录</button>
        </div>
        <div class="acc-hint">退出后，这台设备需要重新登录（或重新扫码）才能继续访问。</div>
    </div>
</div>

<script src="/static/app.js"></script>
<script>
var myRole = __MY_ROLE__;
// 游客不显示下载器 / 管理入口（与浏览页一致）
(function () {
    var isGuest = myRole === 'guest' || !myRole;
    var navDl = document.getElementById('accNavDownloader');
    var navAd = document.getElementById('accNavAdmin');
    if (navDl) navDl.style.display = isGuest ? 'none' : '';
    if (navAd) navAd.style.display = (myRole === 'admin' || myRole === 'super_admin') ? '' : 'none';
})();

var ROLE_TEXT = { super_admin: '超级管理员', admin: '管理员', user: '普通用户', guest: '游客' };

function setTxt(id, v) { var el = document.getElementById(id); if (el) el.textContent = v || '-'; }

function onLangChange() {
    var sel = document.getElementById('langSel');
    var v = sel && sel.value === 'en' ? 'en' : 'zh';
    try { document.cookie = 'leaf_lang=' + v + '; path=/; max-age=31536000'; } catch (e) {}
    if (window.i18n) window.i18n.setLang(v);
    // 刷新让服务端按语言返回对应版本页面（存在 .en.html 时返回英文版文件）
    window.location.reload();
}
// 语言相关 UI 刷新：选择器回显 + 对刚写入的动态文案重新翻译
function applyLangUi() {
    var sel = document.getElementById('langSel');
    if (sel && window.i18n) sel.value = window.i18n.lang();
    if (window.i18n) window.i18n.apply();
}

fetch('/api/auth/check')
    .then(function (r) { return r.json(); })
    .then(function (d) {
        if (!d || typeof d !== 'object') return;
        var role = d.role || myRole || '';
        var name = d.username || (role === 'guest' ? '游客' : '');
        setTxt('rowUser', name || '游客');
        setTxt('accName', name || '游客');
        setTxt('rowRole', ROLE_TEXT[role] || role || '-');
        setTxt('accRole', (ROLE_TEXT[role] || role || '') + (role === 'guest' ? ' · 仅可访问公共目录' : ''));
        setTxt('rowGuest', d.guest_mode ? '开启（游客可浏览公共目录）' : '关闭');
        var av = document.getElementById('accAvatar');
        if (av) av.textContent = (name || '?').charAt(0).toUpperCase();
        if (d.need_change_password && (role === 'admin' || role === 'super_admin')) {
            var w = document.getElementById('accWarn');
            if (w) w.style.display = 'block';
        }
        applyLangUi();
    })
    .catch(function () { applyLangUi(); });

setTxt('rowServer', window.location.origin);
applyLangUi();

document.getElementById('logoutBtn').addEventListener('click', function () {
    var T = function (s) { return window.i18n ? window.i18n.t(s) : s; };
    if (!window.confirm(T('确定要退出登录吗？'))) return;
    var btn = document.getElementById('logoutBtn');
    btn.disabled = true; btn.textContent = T('正在退出…');
    var xhr = new XMLHttpRequest();
    xhr.open('POST', '/api/auth/logout', true);
    xhr.onload = function () { window.location.href = '/login'; };
    xhr.onerror = function () {
        btn.disabled = false; btn.textContent = T('退出登录');
        window.alert(T('退出失败，请稍后重试'));
    };
    xhr.send('');
});
</script>
</body>
</html>
