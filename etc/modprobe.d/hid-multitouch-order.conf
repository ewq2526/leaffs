# HTIX5288 这块触摸板是 I2C HID（0911:5288）。i2c_hid_acpi 建出 HID 设备的那一刻，
# hid_multitouch 往往还没加载，于是 hid-generic 先被绑定、生成一套 input 节点；等
# hid_multitouch 由 modalias 自动加载，再把 hid-generic 解开、重建一套。
#
# 重建本身无害，坏在时机：Xorg 若在这两步之间启动，抓到的是即将被撤掉的节点。之后
# event* 变成 device removed，libinput 再去建 /dev/input/mouse1 就失败，触摸板从此
# 不响应——现象就是"有时候掉驱动"。
#
# 把顺序写成依赖：加载 i2c_hid_acpi 之前先加载 hid_multitouch，设备一出现就由正确的
# 驱动绑定，不存在重建。
softdep i2c_hid_acpi pre: hid_multitouch
