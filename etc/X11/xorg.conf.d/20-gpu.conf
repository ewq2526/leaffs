# X 在开机时可能比 i915 先就绪：这个驱动由 udev 加载，KMS 建出输出要晚几百毫秒。
# 默认情况下没有屏 X 就以 "no screens found" 退出，靠单元的 Restart 重来一次。
#
# 打开 AllowEmptyInitialConfiguration：没有屏也先把 X 起来，之后 GPU 出现、输出接上时
# 由 X 自己把屏加进来，不需要等、也不会失败退出。
#
# 不写 Driver：驱动由 X 自己按设备挑（modesetting）。写死会盖掉自动探测，名字写错
# 就变成 "no drivers available"。
Section "Device"
    Identifier "gpu"
    Option     "AllowEmptyInitialConfiguration" "true"
EndSection
