# most：内核自带的绝大多数驱动都进 initramfs。
# 这套介质要装到各种机器上，根盘可能是 SATA、NVMe、eMMC 或虚拟机里的 virtio，
# 构建机上看不到目标机是什么，只能把可能用到的都带上。
# list 只收 /etc/initramfs-tools/modules 里列的模块，会漏掉 NVMe 这类盘，
# 后果是内核起来了却找不到根，直接掉进 initramfs 的 shell。
MODULES=most
# zstd：压缩比与 gzip 接近但快得多，gzip 压 initrd 时单线程跑满一个核。
# Debian 13 的内核带 CONFIG_RD_ZSTD，能直接读 zstd 的 initrd。
COMPRESS=zstd
