[global]
	server string = Camphor File Appliance
	netbios name = CAMPHOR
	workgroup = WORKGROUP
	map to guest = Bad User
	server min protocol = SMB2_10
	server max protocol = SMB3_11
	logging file = /var/log/ksmbd/ksmbd.log

# 下面两处用户名是占位：装好的系统里由 d-i 改成安装者创建的账号
# （mkimage/live/config/includes.installer/preseed.cfg 的 late_command）。
# 镜像里不写死某个账号——账号是安装时才知道的。

[public]
	path = /srv/leaffs/shared_files/public
	read only = no
	guest ok = yes
	force user = nobody
	browseable = yes
	writable = yes

[users]
	path = /srv/leaffs/shared_files/users
	read only = no
	valid users = nobody
	browseable = yes
	writable = yes
