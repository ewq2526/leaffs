[global]
	server string = LeafOS File Appliance
	netbios name = LEAFOS
	workgroup = WORKGROUP
	map to guest = Bad User
	server min protocol = SMB2_10
	server max protocol = SMB3_11
	logging file = /var/log/ksmbd/ksmbd.log

[public]
	path = /srv/leaffs/shared_files/public
	read only = no
	guest ok = yes
	force user = leaf
	browseable = yes
	writable = yes

[users]
	path = /srv/leaffs/shared_files/users
	read only = no
	valid users = leaf
	browseable = yes
	writable = yes
