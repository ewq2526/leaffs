# 日志不落盘，只留在内存里。
#
# 这是成品系统：盘上每写一次都是无谓的磨损与噪音，而 journal 在这里主要是给
# 网页的日志页看"当前这次启动发生了什么"。改成 volatile 之后，运行期间一条都不写盘。
#
# 正常关机的日志由 camphor-journal-flush.service 在关机时一次性写回 /var/log/journal，
# 所以重启前的记录仍然留得下来；断电这种非正常关机才会丢。
#
# 想看单条日志以外的历史，就在关机前从网页日志页取。
[Journal]
Storage=volatile
# 内存里最多留 64 MB，超了从最旧的开始丢
RuntimeMaxUse=64M
