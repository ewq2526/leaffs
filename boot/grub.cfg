set timeout=8
set default=0
insmod part_gpt
insmod ext2
insmod fat
insmod chain
insmod font

# 按卷标找根，不写 UUID —— 镜像写到哪块盘、哪个分区都能起，换机器不用改本文件。
# 安装要求（见 mkimage/BUILD.md）：
#   - 根分区卷标取 camphor：e2label /dev/sdX2 camphor
#   - /boot/vmlinuz 与 /boot/initrd.img 指向实际的内核与 initramfs：
#     ln -sf vmlinuz-<ver> /boot/vmlinuz; ln -sf initrd.img-<ver> /boot/initrd.img
menuentry 'Camphor' --id camphor {
    search --no-floppy --label camphor --set=root
    echo 'Loading Camphor ...'
    linux /boot/vmlinuz root=LABEL=camphor rw rootwait net.ifnames=0 console=tty0 panic=10 loglevel=4
    initrd /boot/initrd.img
}

# 多系统：其它系统的引导项属于安装现场的配置，不随仓库发布。
# 形如 search --fs-uuid --set=root <目标机器 ESP 的 UUID> 再 chainloader /EFI/.../bootmgfw.efi。
