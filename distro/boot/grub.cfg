set timeout=8
set default=1
insmod part_gpt
insmod ext2
insmod fat
insmod chain
insmod font

menuentry 'LeafOS (Debian kernel, signed)' --id leafos-debian {
    search --no-floppy --fs-uuid --set=root 17bdfc92-aa78-445a-8a21-dea3651f30ab
    echo 'Loading Debian 6.12.113 (signed) + minimal initramfs ...'
    linux /boot/vmlinuz-6.12.113+deb13-amd64 root=PARTUUID=1c5c1d24-9e66-46a1-85bc-81d9641de983 rw rootwait net.ifnames=0 console=tty0 panic=10 loglevel=4
    initrd /boot/initrd.img-6.12.113+deb13-amd64
}
menuentry 'LeafOS 7.3 (current)' --id leafos-current {
    search --no-floppy --fs-uuid --set=root 17bdfc92-aa78-445a-8a21-dea3651f30ab
    echo 'Loading LeafOS 7.3 current kernel ...'
    linux /boot/vmlinuz-7.3.0-leafos root=PARTUUID=1c5c1d24-9e66-46a1-85bc-81d9641de983 rw rootwait net.ifnames=0 console=tty0 console=ttyS0 panic=10 loglevel=7
}

menuentry 'LeafOS 7.3 (previous - fallback)' --id leafos-prev {
    search --no-floppy --fs-uuid --set=root 17bdfc92-aa78-445a-8a21-dea3651f30ab
    echo 'Loading LeafOS 7.3 previous kernel ...'
    linux /boot/vmlinuz-7.3.0-leafos.prev root=PARTUUID=1c5c1d24-9e66-46a1-85bc-81d9641de983 rw rootwait net.ifnames=0 console=tty0 console=ttyS0 panic=10 loglevel=4
}

submenu 'Other systems on internal disk (sda)' --id others {
    menuentry 'Windows Boot Manager' --id win {
        search --no-floppy --fs-uuid --set=root 08CD-3EAF
        chainloader /EFI/Microsoft/Boot/bootmgfw.efi
    }
    menuentry 'Debian GNU/Linux (installed)' --id debian {
        search --no-floppy --fs-uuid --set=root 08CD-3EAF
        if [ -f /EFI/debian/shimx64.efi ]; then
            chainloader /EFI/debian/shimx64.efi
        else
            chainloader /EFI/debian/grubx64.efi
        fi
    }
}
